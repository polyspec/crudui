[package]
name = "polyspec-crudui-native-generator"
version = "0.0.9"
edition = "2021"
rust-version = "1.99.0"
publish = false

[dependencies]
polyspec-crudui-generator = { path = "../../../../packages/generator/rust" }
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }

[lints]
workspace = true

[workspace]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"
