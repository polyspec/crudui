[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polyspec-crudui-generator"
version = "0.0.3"
description = "Form, list and detail rendering for CRUDUI specifications"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "polyspec-crudui-validator @ git+https://github.com/polyspec/crudui@v0.0.4#subdirectory=packages/validator-python",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"polyspec.crudui.generator" = ["py.typed"]
