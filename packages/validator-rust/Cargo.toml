[package]
name = "crudui-validator"
version = "0.0.1"
edition = "2021"

[lib]
name = "crudui_validator"
path = "src/lib.rs"

[[bin]]
name = "validate-legacy"
path = "src/bin/validate-legacy.rs"

[[bin]]
name = "validate"
path = "src/bin/validate.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"

[profile.release]
# Keep release artifacts unstripped. Cargo's debuginfo strip invokes the
# toolchain's rust-objcopy, whose macOS distribution may lack libLLVM.dylib.
# The validator build must not report a successful binary after that step fails.
strip = "none"
