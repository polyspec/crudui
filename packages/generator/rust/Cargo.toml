[package]
name = "polyspec-crudui-generator"
version = "0.0.7"
edition = "2021"
rust-version = "1.99.0"
license = "MIT"
description = "CRUDUI form compilation, data binding and HTML rendering"

[dependencies]
polyspec-crudui-validator = { path = "../../validator/rust", version = "0.0.7" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
getrandom = "0.4"
chrono = "0.4"
regex = "1"
ryu-js = "1"
num-bigint = "0.5"
num-traits = "0.2"

[dev-dependencies]
libtest-mimic = "0.8"

[[test]]
name = "history_functions"
harness = false

[[test]]
name = "input_text"
harness = false

[[test]]
name = "template_shape"
harness = false

[[test]]
name = "form_state"
harness = false

[[test]]
name = "form_render"
harness = false

[[test]]
name = "buttons"
harness = false

[lints]
workspace = true

[workspace]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"
