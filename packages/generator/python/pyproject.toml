[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polyspec-crudui-generator"
version = "0.0.8"
description = "Form, list and detail rendering for CRUDUI specifications"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "polyspec-crudui-validator @ https://github.com/polyspec/crudui/releases/download/v0.0.8/polyspec_crudui_validator-0.0.8-py3-none-any.whl",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"polyspec.crudui.generator" = ["py.typed"]
