[package]
name = "polyspec-crudui-validator"
version = "0.0.8"
edition = "2021"
rust-version = "1.99.0"
license = "MIT"

[lib]
name = "polyspec_crudui_validator"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[dev-dependencies]
libtest-mimic = "0.8"

[[test]]
name = "validate_conformance"
harness = false

[[test]]
name = "expr_conformance"
harness = false

[[test]]
name = "text_validity_conformance"
harness = false

[[test]]
name = "list_validity_conformance"
harness = false

[[test]]
name = "detail_validity_conformance"
harness = false

[[test]]
name = "spec_validity_conformance"
harness = false

[[test]]
name = "compose_conformance"
harness = false

[lints]
workspace = true

[workspace]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"
