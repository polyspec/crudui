# The push check of every pushed branch. The pre-push hook .githooks/pre-push refuses a push while a checklist task is [~];
# a push past the hook, from a clone without it or with the hook skipped, reaches GitHub, and this job fails for it with
# the same message. It checks the pushed commit: its checklist has no task in progress, and it tracks the hook as an
# executable file. It also runs make records-check, the document and checklist rules, which read no network and no
# history. It starts on branch pushes only: a tag push would leave a push-gate run that has not completed on the tagged
# commit, and the release requires the check to have succeeded there. A release requires this job, with ci-passed, to have succeeded for the tagged commit. make toolchain-check
# reads the floors of every Cargo.toml through cargo metadata, so the job installs the tools of the checkout with make
# install-tools first, the Rust toolchain of rust-toolchain.toml among them (kit K151).

name: Push check

on:
  push:
    branches: ['**']

permissions:
  contents: read

# The toolchains of the checkout at their recorded versions (docs/operations/package-build.md): rustup installs nothing on the
# first cargo, and go never downloads the toolchain of a go.mod.
env:
  RUSTUP_AUTO_INSTALL: '0'
  GOTOOLCHAIN: local

jobs:
  push-gate:
    name: push-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Setup selected Node.js release line
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: 'mise.toml'
          package-manager-cache: false
      - name: Cache the npm packages of package-lock.json
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Bootstrap the installed kit package
        run: |
          npm_config_cache="$PWD/var/bootstrap/npm-cache" npm exec --yes --package="$(node -p 'require("./package.json").packageManager.split("+")[0]')" -- npm ci --ignore-scripts --allow-remote=root
      - name: Install the npm of packageManager into var/tools
        run: make install-tools TOOLS="npm"
      - name: Install the packages of package-lock.json, @polyspec/kit included
        run: make install-packages
      - name: Install the tools of mise.lock into var/tools/mise
        run: make install-tools
      - name: Check the recorded toolchain versions
        run: make toolchain-check TOOLS="node npm"
      - name: Refuse a commit with a task in progress or broken records
        if: ${{ !cancelled() }}
        run: make ci-targets TARGETS="push-gate-commit records-check"
      - name: Upload the report of the checks
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-push-gate
          path: var/report/ci-targets
          if-no-files-found: error
