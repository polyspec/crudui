# The push check of every pushed branch. The pre-push hook .githooks/pre-push refuses a push while a checklist task is [~];
# a push past the hook, from a clone without it or with the hook skipped, reaches GitHub, and this job fails for it with
# the same message. It checks the pushed commit: its checklist has no task in progress, and it tracks the hook as an
# executable file. It also runs make records-check, the document and checklist rules, which read no network and no
# history. It starts on branch pushes only: a tag push would leave a push-gate run that has not completed on the tagged
# commit, and the release requires the check to have succeeded there. A release requires this job, with ci-passed, to have succeeded for the tagged commit. The check needs Node.js
# alone and installs no dependency.

name: Push check

on:
  push:
    branches: ['**']

permissions:
  contents: read

# The toolchains of the checkout at their recorded versions (docs/spec/package-build.md): rustup installs nothing on the
# first cargo, and go never downloads the toolchain of a go.mod.
env:
  RUSTUP_AUTO_INSTALL: '0'
  GOTOOLCHAIN: local

jobs:
  push-gate:
    name: push-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
      - name: Setup selected Node.js release line
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.node-version'
      - name: Check the recorded toolchain versions
        run: make toolchain-check TOOLS=node
      - name: Refuse a commit with a task in progress or broken records
        if: ${{ !cancelled() }}
        run: make ci-targets TARGETS="push-gate-commit records-check"
      - name: Upload the report of the checks
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-push-gate
          path: var/report/ci-targets
          if-no-files-found: error
