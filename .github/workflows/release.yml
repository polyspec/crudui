# The GitHub Release of a pushed tag (AGENTS.md, docs/operations/repository.md). Every commit of main passed the checks
# that the ruleset main requires, through a pull request and the merge queue; the maintainer tags a commit of main as
# vX.Y.Z, or <directory>/vX.Y.Z for a Go module in a subdirectory, after the pull request that sets the version. In a
# tag filter * does not match /, so '**/v*' covers the tag packages/<directory>/vX.Y.Z of a Go module at any depth. The
# job runs no test again, and its last five steps run in this order: make release-verify requires the commit on main
# with the check runs push-gate and ci-passed concluded success; make release-versions the version of the tag in every
# package file that it covers and the section ## X.Y.Z of CHANGELOG.md; make release-assets builds the JavaScript
# packages and writes the npm tarballs and Composer zips (a crate is not released as an archive; it is consumed by git
# tag), and a Go module tag builds and attaches nothing; make release-install-check installs the archives of the tag from
# the consumer fixtures of tests/release-install with empty caches, and for a Go module tag names the tag and installs
# nothing (scripts/release-install.mjs); make release-publish creates the release with that section as
# its notes (scripts/release.mjs). TAG reaches the make targets through the environment, never as shell text.

name: Release

on:
  push:
    tags: ['v*', '**/v*']

permissions:
  contents: write

# The toolchains of the checkout at their recorded versions (docs/spec/package-build.md): rustup installs nothing on the
# first cargo, and go never downloads the toolchain of a go.mod.
env:
  RUSTUP_AUTO_INSTALL: '0'
  GOTOOLCHAIN: local

jobs:
  release:
    name: release
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # The whole history, so origin/main is present for git merge-base --is-ancestor.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Setup the Node.js release of .node-version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.node-version'
      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          tools: composer:2.10.3
      - name: Cache the npm packages of package-lock.json
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Install the recorded npm into the checkout
        run: make install-npm
      - name: Check the recorded toolchain versions
        run: make toolchain-check TOOLS="node npm php composer"
      - name: Install workspace dependencies
        run: make install-node-modules
      - name: Check that the tagged commit is on main and passed its checks
        run: make release-verify
      - name: Check the versions and the change log section of the tag
        run: make release-versions
      - name: Build the JavaScript packages and write the package archives
        run: make release-assets
      - name: Install the archives from the consumer fixtures with empty caches
        run: make release-install-check
      - name: Create the GitHub Release with the archives
        run: make release-publish
