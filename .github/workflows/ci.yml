# Build, validation, rendering and documentation checks of every push to main and of every manual run. The last job
# ci-passed needs every other job and fails unless each of them succeeded; a release requires it and push-gate to have
# succeeded for the tagged commit (docs/operations/repository.md). The documentation web of main is deployed by
# .github/workflows/pages.yml.

name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

# The run of a commit of main is never cancelled by a later push: a release requires the checks of its own commit
# (tests/build/ci-local.test.mjs).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# The toolchains of the checkout at their recorded versions (docs/spec/package-build.md): rustup installs nothing on the
# first cargo, and go never downloads the toolchain of a go.mod.
env:
  RUSTUP_AUTO_INSTALL: '0'
  GOTOOLCHAIN: local

jobs:
  build-lint:
    name: build, lint and types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup the Node.js release of .node-version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.node-version'
      - name: Cache the npm packages of package-lock.json
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Install the Rust toolchain of rust-toolchain.toml
        run: make install-rust
      - name: Install the declared tools into var/tools
        run: make install-tools
      # The runtime checks compare every running tool with the version that the checkout records.
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          tools: composer:2.10.3
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: '.go-version'
          cache: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Check the recorded toolchain versions
        run: make toolchain-check TOOLS="node npm go rust php python composer"
      - name: Install workspace dependencies
        run: make install-node-modules
      - name: Run the checks and write their report
        if: ${{ !cancelled() }}
        run: make ci-targets TARGETS="test-runtimes test-dependencies build lint typecheck test-ordered-json"
      - name: Upload the report of the checks
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-build-lint
          path: var/report/ci-targets
          if-no-files-found: error
  validator-js:
    name: validator · JavaScript
    runs-on: ubuntu-24.04
    env:
      CRUDUI_CONFORMANCE_EVIDENCE: ${{ github.workspace }}/conformance-evidence
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup the Node.js release of .node-version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.node-version'
      - name: Cache the npm packages of package-lock.json
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Install the Rust toolchain of rust-toolchain.toml
        run: make install-rust
      - name: Install the declared tools into var/tools
        run: make install-tools
      - name: Check the recorded toolchain versions
        run: make toolchain-check TOOLS="node npm rust"
      - name: Install workspace dependencies
        run: make install-node-modules
      - name: Run the checks and write their report
        if: ${{ !cancelled() }}
        run: make ci-targets TARGETS="test-validator-js"
      - name: Upload the report of the checks
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-validator-js
          path: var/report/ci-targets
          if-no-files-found: error
      - name: Preserve conformance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-evidence-validator-js
          path: conformance-evidence/
          if-no-files-found: error

  validator-php:
    name: validator · PHP (${{ matrix.php }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    env:
      CRUDUI_CONFORMANCE_EVIDENCE: ${{ github.workspace }}/conformance-evidence
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup the Node.js release of .node-version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.node-version'
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:2.10.3
      - name: Check the recorded toolchain versions
        run: make toolchain-check TOOLS="node php composer"
      - name: Install PHP dependencies
        run: make install-composer
      - name: Run the checks and write their report
        if: ${{ !cancelled() }}
        run: make ci-targets TARGETS="test-validator-php"
      - name: Upload the report of the checks
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-validator-php-${{ matrix.php }}
          path: var/report/ci-targets
          if-no-files-found: error
      - name: Preserve conformance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-evidence-validator-php-${{ matrix.php }}
          path: conformance-evidence/
          if-no-files-found: error

  validator-go:
    name: validator · Go
    runs-on: ubuntu-24.04
    env:
      CRUDUI_CONFORMANCE_EVIDENCE: ${{ github.workspace }}/conformance-evidence
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup the Node.js release of .node-version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.node-version'
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: '.go-version'
          cache-dependency-path: packages/validator-go/go.mod
      - name: Check the recorded toolchain versions
        run: make toolchain-check TOOLS="node go"
      - name: Run the checks and write their report
        if: ${{ !cancelled() }}
        run: make ci-targets TARGETS="test-validator-go"
      - name: Upload the report of the checks
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-validator-go
          path: var/report/ci-targets
          if-no-files-found: error
      - name: Preserve conformance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-evidence-validator-go
          path: conformance-evidence/
          if-no-files-found: error

  validator-rust:
    name: validator · Rust
    runs-on: ubuntu-24.04
    env:
      CRUDUI_CONFORMANCE_EVIDENCE: ${{ github.workspace }}/conformance-evidence
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup the Node.js release of .node-version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.node-version'
      - name: Install the Rust toolchain of rust-toolchain.toml
        run: make install-rust
      - name: Check the recorded toolchain versions
        run: make toolchain-check TOOLS="node rust"
      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: packages/validator-rust
      - name: Download the crates of every Cargo.lock
        run: make install-crates
      - name: Run the checks and write their report
        if: ${{ !cancelled() }}
        run: make ci-targets TARGETS="test-validator-rust"
      - name: Upload the report of the checks
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-validator-rust
          path: var/report/ci-targets
          if-no-files-found: error
      - name: Preserve conformance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-evidence-validator-rust
          path: conformance-evidence/
          if-no-files-found: error

  python:
    name: python · ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    env:
      CRUDUI_CONFORMANCE_EVIDENCE: ${{ github.workspace }}/conformance-evidence
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Setup the Node.js release of .node-version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.node-version'
      # The release of .python-version is the matrix leg 3.14; the recorded toolchain names that release.
      - name: Check the recorded toolchain versions
        if: ${{ matrix.python == '3.14' }}
        run: make toolchain-check TOOLS="node python"
      - name: Run the checks and write their report
        if: ${{ !cancelled() }}
        run: make ci-targets TARGETS="test-validator-python test-generator-python"
      - name: Upload the report of the checks
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-python-${{ matrix.python }}
          path: var/report/ci-targets
          if-no-files-found: error
      # Both legs record the same evidence; the recorded release leg preserves it.
      - name: Preserve conformance evidence
        if: ${{ !cancelled() && matrix.python == '3.14' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-evidence-python
          path: conformance-evidence/
          if-no-files-found: error

  docs-coverage:
    name: documentation gate
    runs-on: ubuntu-24.04
    env:
      DOCS_BASE_PATH: /crudui/
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup the Node.js release of .node-version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.node-version'
      - name: Cache the npm packages of package-lock.json
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          tools: composer:2.10.3
      - name: Install PHP dependencies
        run: make install-composer
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: '.go-version'
          cache-dependency-path: packages/validator-go/go.mod
      - name: Install the Rust toolchain of rust-toolchain.toml
        run: make install-rust
      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: packages/validator-rust
      - name: Install the declared tools into var/tools
        run: make install-tools
      - name: Check the recorded toolchain versions
        run: make toolchain-check TOOLS="node npm go rust php composer"
      - name: Install workspace dependencies
        run: make install-node-modules
      - name: Install PHP API documentation generator
        run: make install-phpdocumentor
      - name: Download the crates of every Cargo.lock
        run: make install-crates
      - name: Run the checks and write their report
        if: ${{ !cancelled() }}
        run: make ci-targets TARGETS="docs-check"
      - name: Upload the report of the checks
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-docs-coverage
          path: var/report/ci-targets
          if-no-files-found: error

  cross-check-console:
    name: cross-check console gateway
    runs-on: ubuntu-24.04
    env:
      PHP_EXTENSION_PHP_CONFIG: /usr/bin/php-config8.5
      CRUDUI_CONFORMANCE_EVIDENCE: ${{ github.workspace }}/conformance-evidence
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup the Node.js release of .node-version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.node-version'
      - name: Cache the npm packages of package-lock.json
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          tools: composer:2.10.3
      - name: Install PHP dependencies
        run: make install-composer
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: '.go-version'
          cache-dependency-path: |
            packages/validator-go/go.mod
            examples/cross-check-console/validators/go/go.mod
      - name: Install the Rust toolchain of rust-toolchain.toml
        run: make install-rust
      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: examples/cross-check-console/validators/rust
      - name: Install the declared tools into var/tools
        run: make install-tools
      - name: Check the recorded toolchain versions
        run: make toolchain-check TOOLS="node npm go rust php composer"
      - name: Install workspace dependencies
        run: make install-node-modules
      - name: Download the crates of every Cargo.lock
        run: make install-crates
      - name: Run the checks and write their report
        if: ${{ !cancelled() }}
        run: make ci-targets TARGETS="build-php-extension test-cross-check manifest-test"
      - name: Upload the report of the checks
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-cross-check-console
          path: var/report/ci-targets
          if-no-files-found: error
      - name: Preserve conformance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-evidence-cross-check-console
          path: conformance-evidence/
          if-no-files-found: error

  cli:
    name: command-line interface
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup the Node.js release of .node-version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.node-version'
      - name: Cache the npm packages of package-lock.json
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Install the Rust toolchain of rust-toolchain.toml
        run: make install-rust
      - name: Install the declared tools into var/tools
        run: make install-tools
      - name: Check the recorded toolchain versions
        run: make toolchain-check TOOLS="node npm rust"
      - name: Install workspace dependencies
        run: make install-node-modules
      - name: Run the checks and write their report
        if: ${{ !cancelled() }}
        run: make ci-targets TARGETS="require-build test-cli"
      - name: Upload the report of the checks
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-cli
          path: var/report/ci-targets
          if-no-files-found: error
  form-runtime:
    name: Form instances and data injection
    runs-on: ubuntu-24.04
    env:
      CRUDUI_CONFORMANCE_EVIDENCE: ${{ github.workspace }}/conformance-evidence
      # The Chrome and Firefox builds that puppeteer pins, in the checkout (scripts/install-browsers.mjs).
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/.tools/puppeteer
      CHROME_DEVEL_SANDBOX: /usr/local/sbin/chrome-devel-sandbox
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup the Node.js release of .node-version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.node-version'
      - name: Cache the npm packages of package-lock.json
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Install the Rust toolchain of rust-toolchain.toml
        run: make install-rust
      - name: Install the declared tools into var/tools
        run: make install-tools
      - name: Check the recorded toolchain versions
        run: make toolchain-check TOOLS="node npm rust"
      - name: Install workspace dependencies
        run: make install-node-modules
      - name: Install the browsers that Puppeteer and Playwright pin
        run: make install-browsers BROWSERS="chrome firefox webkit --with-deps --chrome-sandbox"
      - name: Verify sandboxed Chrome
        run: make check-ci-browser
      - name: Run the checks and write their report
        if: ${{ !cancelled() }}
        run: make ci-targets TARGETS="manifest-check manifest-docs-check test-forms"
      - name: Upload the report of the checks
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-form-runtime
          path: var/report/ci-targets
          if-no-files-found: error
      - name: Preserve conformance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-evidence-form-runtime
          path: conformance-evidence/
          if-no-files-found: error

  form-comparison:
    name: Form comparison runner regressions
    runs-on: ubuntu-24.04
    env:
      # The Chrome and Firefox builds that puppeteer pins, in the checkout (scripts/install-browsers.mjs).
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/.tools/puppeteer
      CHROME_DEVEL_SANDBOX: /usr/local/sbin/chrome-devel-sandbox
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup the Node.js release of .node-version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.node-version'
      - name: Cache the npm packages of package-lock.json
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          tools: composer:2.10.3
      - name: Install the Rust toolchain of rust-toolchain.toml
        run: make install-rust
      - name: Install the declared tools into var/tools
        run: make install-tools
      - name: Check the recorded toolchain versions
        run: make toolchain-check TOOLS="node npm rust php composer"
      - name: Install workspace and PHP dependencies
        run: make install-node-modules install-composer
      - name: Install the browsers that Puppeteer pins
        run: make install-browsers BROWSERS="chrome --chrome-sandbox"
      - name: Verify sandboxed Chrome
        run: make check-ci-browser
      - name: Run the checks and write their report
        if: ${{ !cancelled() }}
        run: make ci-targets TARGETS="test-form-comparison"
      - name: Upload the report of the checks
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-form-comparison
          path: var/report/ci-targets
          if-no-files-found: error
  form-comparison-pipeline:
    name: Record stores and the canonical flow
    runs-on: ubuntu-24.04
    env:
      # The Chrome and Firefox builds that puppeteer pins, in the checkout (scripts/install-browsers.mjs).
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/.tools/puppeteer
      CHROME_DEVEL_SANDBOX: /usr/local/sbin/chrome-devel-sandbox
      PHP_EXTENSION_PHP_CONFIG: /usr/bin/php-config8.5
    steps:
