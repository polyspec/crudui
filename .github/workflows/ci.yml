# CI — YAML form-spec multi-language validators + multi-framework generators.
#
# This workflow only INVOKES the project's existing gate commands. It does not
# define new gates. Every command below maps to a real script in package.json,
# Makefile, or a per-package test runner verified to exist in the repo.
#
# README CI badge (add by hand into README.md later — this workflow does not
# touch README.md):
#
#   ![CI](https://github.com/yejune/form-spec/actions/workflows/ci.yml/badge.svg)
#
# Gate -> job map:
#   cross-language   node tests/runner/compare-all.js          (JS/PHP/Go/Rust, 1074 cases)
#   validator-unit   per-language unit tests (js/php/go/rust)
#   build-lint       npm run build  +  npm run lint
#   parity           React / Vue / Svelte HTML parity (SSR, no browser)
#   docs-coverage    make docs-check                           (libs + servers, 4 langs)
#
# v2 gate -> job map (R7: runs alongside the v1 gates above, never replaces them):
#   v2-validator-js     npm run test:v2 -w validator-js       (vitest run src/v2; incl. validate-cli)
#   v2-validator-php    composer test:v2                      (phpunit tests/V2; incl. ValidateCliTest)
#   v2-validator-go     go test ./validator/v2/... ./cmd/validate-v2
#   v2-validator-rust   cargo test --test {expr,compose,validate,spec_validity,validate_v2_cli}_conformance
#   v2-render           React/Vue/Svelte v2 SSR conformance   (npm run test:v2 per pkg)
#   cross-check-console gateway verdict units + 4-lang fan-out + HTTP boundary (npm test in server)
#   form-spec-cli       npm test -w form-spec-cli             (vitest run; drift/check-catalog/explain, 23 cases)
#
# v2 shared 4-language fixtures (tests/fixtures/*/cases.json), each loaded by
# every engine that consumes it and asserted bit-for-bit:
#   expr           114 (38 specs x lexer/parser/eval)  JS/PHP/Go/Rust
#   compose         20                                  JS/PHP/Go/Rust
#   validate        28                                  JS/PHP/Go/Rust
#   spec-validity   15 (recursive forbidden-scan)       JS/PHP/Go/Rust
#   v2-render       22 (SSR HTML)                        React/Vue/Svelte
#   v2-list-render  20 (list SSR HTML, SPEC §9)          React/Vue/Svelte
#   v2-list-validity 18 (list meta-schema, SPEC §9.4)    JS (ajv #/definitions/List)
# A v2 regression turns the matching job red via the test runner exit code.
#
# Toolchain pinning rationale:
#   - dist/ and target/ are gitignored, so cross-language must build the JS
#     validator (compare-all loads dist/index.js; no ts-node at root) and the
#     Rust release binary before running. compare-all auto-builds the Go and
#     Rust binaries if missing, but we build Rust explicitly so failures are
#     attributed to the build step, and so rust-cache populates.
#   - validator-php ships a committed vendor/, so PHP unit + parity need no
#     composer install. composer is still set up for the docs-coverage job
#     (DocCoverage filter runs vendor/bin/phpunit).

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # build-lint — root workspace build (validator-js + 3 generators) and lint.
  # `npm run build` => build:validator + build:generators (react/vue/svelte).
  # `npm run lint`  => eslint over validator-js/src + generator-react/src.
  # ---------------------------------------------------------------------------
  build-lint:
    name: build + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node 20
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install workspace deps
        run: npm i -g npm@11.17.0 && npm ci

      - name: Build (validator-js + generator-react/vue/svelte)
        run: npm run build

      - name: Lint
        run: npm run lint

  # ---------------------------------------------------------------------------
  # cross-language — the idempotency gate. Same spec + same data must produce
  # identical results across JS, PHP, Go, Rust over all 1074 cases.
  # Needs ALL FOUR toolchains. The JS validator dist and the Rust release
  # binary are built first (both gitignored; compare-all expects them present).
  # ---------------------------------------------------------------------------
  cross-language:
    name: cross-language idempotency (1074)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node 20
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: packages/validator-go/go.mod

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/validator-rust

      - name: Install workspace deps
        run: npm i -g npm@11.17.0 && npm ci

      - name: Build JS validator (compare-all loads dist/index.js)
        run: npm run build:validator

      - name: Build Rust release binary
        run: cargo build --release --bin validate
        working-directory: packages/validator-rust

      - name: Cross-language compare (JS/PHP/Go/Rust, 1074 cases)
        run: node tests/runner/compare-all.js

  # ---------------------------------------------------------------------------
  # validator-unit — per-language unit suites. Split into one job per language
  # rather than a matrix: each language needs a different toolchain, so a
  # matrix would install all four per shard anyway. Separate jobs give clear
  # red/green per language and let unrelated toolchains cache independently.
  # ---------------------------------------------------------------------------
  validator-unit-js:
    name: unit · validator-js (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node 20
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install workspace deps
        run: npm i -g npm@11.17.0 && npm ci
      - name: Test
        run: npm test
        working-directory: packages/validator-js

  validator-unit-php:
    name: unit · validator-php (phpunit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer
      # vendor/ is committed (phpunit present); composer test == phpunit.
      - name: Test
        run: composer test
        working-directory: packages/validator-php

  validator-unit-go:
    name: unit · validator-go (go test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: packages/validator-go/go.mod
      - name: Test
        run: go test ./...
        working-directory: packages/validator-go

  validator-unit-rust:
    name: unit · validator-rust (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/validator-rust
      - name: Test
        run: cargo test
        working-directory: packages/validator-rust

  # ---------------------------------------------------------------------------
  # parity — HTML parity across the three frameworks. All SSR (vitest), no
  # browser/puppeteer needed. React parity lives in tests/parity (own lockfile
  # => own npm install). Vue/Svelte parity run from their packages, so they
  # need the root workspace build (the generators import @form-spec/validator)
  # plus their built dist.
  # ---------------------------------------------------------------------------
  parity:
    name: HTML parity (React/Vue/Svelte)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node 20
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install workspace deps
        run: npm i -g npm@11.17.0 && npm ci

      - name: Build generators (validator + react/vue/svelte)
        run: npm run build

      - name: React parity
        run: |
          npm ci
          npm test
        working-directory: tests/parity

      - name: Vue parity
        run: npm test
        working-directory: packages/generator-vue

      - name: Svelte parity
        run: npm test
        working-directory: packages/generator-svelte

  # ---------------------------------------------------------------------------
  # docs-coverage — `make docs-check` gates documented public API across the
  # library packages (ts/go/rust/php) AND the examples/* servers (node/go/php/
  # rust). The Makefile prepends ~/.cargo/bin to PATH; the runner cargo is on
  # PATH anyway. Needs all four toolchains. PHP DocCoverage runs vendor/bin/
  # phpunit (committed), so no composer install is required, but composer is
  # set up for completeness.
  # ---------------------------------------------------------------------------
  docs-coverage:
    name: doc-coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node 20
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: packages/validator-go/go.mod

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/validator-rust

      - name: Install workspace deps (typedoc lives here)
        run: npm i -g npm@11.17.0 && npm ci

      - name: Doc-coverage gate (libs + servers, 4 langs)
        run: make docs-check

  # ===========================================================================
  # v2 gates (R7). These run in parallel with the v1 jobs above and gate the v2
  # core: the 4-language validation pipeline (expr/compose/validate/forbidden-
  # scan) and the 3-framework v2 SSR generators. Each job invokes a real,
  # repo-verified test command; a v2 regression turns the job red via the
  # runner's exit code. None of these touch the v1 jobs, scripts, or files.
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # v2-validator-js — vitest over src/v2 only (expr/compose/validate/forbidden-
  # scan conformance + types roundtrip). `npm run test:v2` == `vitest run
  # src/v2`. Loads the shared fixtures expr(114)/compose(20)/validate(28)/
  # spec-validity(15) as the JS reference engine.
  # ---------------------------------------------------------------------------
  v2-validator-js:
    name: v2 · validator-js (vitest src/v2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node 20
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install workspace deps
        run: npm i -g npm@11.17.0 && npm ci
      - name: v2 conformance (vitest src/v2)
        run: npm run test:v2
        working-directory: packages/validator-js

  # ---------------------------------------------------------------------------
  # v2-validator-php — phpunit over tests/V2 only. vendor/ is committed, so no
  # composer install is needed; `composer test:v2` == `phpunit tests/V2`.
  # ---------------------------------------------------------------------------
  v2-validator-php:
    name: v2 · validator-php (phpunit tests/V2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer
      - name: v2 conformance (phpunit tests/V2)
        run: composer test:v2
        working-directory: packages/validator-php

  # ---------------------------------------------------------------------------
  # v2-validator-go — go test over the v2 package tree only. expr/compose/
  # validate conformance + forbidden-scan + types roundtrip live under
  # validator/v2/...; v1 tests (validator/validator_test.go) are excluded by
  # the package path. cmd/validate-v2 is OUTSIDE that glob, so the validate-v2
  # CLI boundary test (main_test.go) is added explicitly.
  # ---------------------------------------------------------------------------
  v2-validator-go:
    name: v2 · validator-go (go test ./validator/v2/... + CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: packages/validator-go/go.mod
      - name: v2 conformance (go test ./validator/v2/... + validate-v2 CLI)
        run: go test ./validator/v2/... ./cmd/validate-v2
        working-directory: packages/validator-go

  # ---------------------------------------------------------------------------
  # v2-validator-rust — the v2 conformance integration tests by name
  # (expr/compose/validate/spec-validity) plus the validate-v2 CLI boundary test.
  # Targeting them with --test excludes the v1 tests/conformance.rs while gating
  # each shared fixture.
  # ---------------------------------------------------------------------------
  v2-validator-rust:
    name: v2 · validator-rust (cargo test v2 conformance + CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/validator-rust
      - name: v2 conformance (expr/compose/validate/spec-validity + validate-v2 CLI)
        run: >
          cargo test
          --test expr_conformance
          --test compose_conformance
          --test validate_conformance
          --test spec_validity_conformance
          --test validate_v2_cli_conformance
        working-directory: packages/validator-rust

  # ---------------------------------------------------------------------------
  # v2-render — the 3-framework v2 SSR conformance. `npm run test:v2` per package
  # runs BOTH shared-fixture conformance files: the form render (v2-render,
  # tests/fixtures/v2-render) and the LIST render (v2-list-render,
  # tests/fixtures/v2-list-render — SPEC §9, the read sister). Every framework
  # must reproduce the React reference's normalized expected_html after the shared
  # normalizer. The list meta-schema gate (SPEC §9.4) rides the v2-validator-js
  # job (vitest run src/v2 picks up list-metaschema.conformance.test.ts).
  # Generators import @form-spec/validator (dist), so the validator is built first.
  # ---------------------------------------------------------------------------
  v2-render:
    name: v2 render (React/Vue/Svelte SSR — form + list)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node 20
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install workspace deps
        run: npm i -g npm@11.17.0 && npm ci

      - name: Build JS validator (generators import @form-spec/validator)
        run: npm run build:validator

      - name: React v2 render
        run: npm run test:v2
        working-directory: packages/generator-react

      - name: Vue v2 render
        run: npm run test:v2
        working-directory: packages/generator-vue

      - name: Svelte v2 render
        run: npm run test:v2
        working-directory: packages/generator-svelte

  # ---------------------------------------------------------------------------
  # cross-check-console — the gateway's own conformance: the verdict pure
  # functions (compareIdempotency / compareParity, incl. tamper RED cases) AND
  # the real fan-outs (validateAll spawns the four v2 CLIs; renderAll boots the
  # Vite SSR engine for React/Svelte/Vue) AND the HTTP boundary (coerceSpec
  # YAML/object, client fault = 4xx, validation failure = 200 result surface,
  # CORS, /health). The real validate fan-out needs the compiled Go/Rust CLIs,
  # so all four toolchains are set up (same as the cross-language job) and
  # build:cli runs before the gateway tests. `npm test` resolves vitest from the
  # root workspace node_modules (no separate lockfile).
  # ---------------------------------------------------------------------------
  cross-check-console:
    name: v2 · cross-check-console gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node 20
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: packages/validator-go/go.mod

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/validator-rust

      - name: Install workspace deps
        run: npm i -g npm@11.17.0 && npm ci

      - name: Build JS validator (render engine imports @form-spec/validator)
        run: npm run build:validator

      - name: Build Go + Rust validate-v2 CLIs (gateway spawns them)
        run: npm run build:cli
        working-directory: examples/cross-check-console/server

      - name: Gateway conformance (verdict units + fan-out + HTTP boundary)
        run: npm test
        working-directory: examples/cross-check-console/server

  # ---------------------------------------------------------------------------
  # form-spec-cli — the toolchain's own conformance: the orchestrator CLI's
  # drift-0 / catalog / explain projections (test/{drift,check-catalog,explain}
  # .test.ts, 23 cases). describe/check/explain are JS-only: the tests import
  # generator-core and validator-js TS SOURCE directly (../../generator-core/src,
  # ../../validator-js/src) and vitest transpiles on the fly, so NO dist build is
  # needed — no go/rust/php toolchain, no build step. `npm test` == `vitest run`.
  # Mirrors cross-check-console: the toolchain layer gets the same idempotent CI
  # gate the console layer already has.
  # ---------------------------------------------------------------------------
  form-spec-cli:
    name: v2 · form-spec-cli (describe/check/explain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node 20
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install workspace deps
        run: npm i -g npm@11.17.0 && npm ci

      - name: CLI conformance (drift/check-catalog/explain, 23 cases)
        run: npm test
        working-directory: packages/form-spec-cli
