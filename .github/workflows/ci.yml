      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: packages/validator/rust
      - name: Download the modules that the Go workspace requires
        run: make crudui-install-go-modules
      - name: Check the recorded toolchain versions
        run: make toolchain-check TOOLS="node npm go rust php composer"
      - name: Install PHP API documentation generator
        run: make crudui-install-phpdocumentor
      - name: Download the crates of every Cargo.lock
        run: make crudui-install-crates
      - name: Run the checks and write their report
        if: ${{ !cancelled() }}
        run: make ci-targets TARGETS="docs-check"
      - name: Upload the report of the checks
        if: ${{ !cancelled() }}
