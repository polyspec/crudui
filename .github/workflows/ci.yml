          name: native-generators-php
          path: .git/native-generators/report-php.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Preserve conformance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-evidence-php-api
          path: conformance-evidence/
          if-no-files-found: error

  conformance:
    name: conformance evidence against the standard
    needs: [validator-js, validator-php, validator-go, validator-rust, python, cross-check-console, form-runtime, php-engine, native-generators, php-api]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    env:
      CRUDUI_CONFORMANCE_EVIDENCE: conformance-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup the Node.js of mise.toml, which starts the bootstrap
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: 'mise.toml'
      - name: Cache the npm packages of package-lock.json
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Install the npm of packageManager into var/tools
        run: make install-tools TOOLS="npm"
      - name: Install the packages of package-lock.json, @polyspec/kit included
        run: make install-packages
      - name: Install the tools of mise.lock into var/tools/mise and the Rust toolchain of rust-toolchain.toml
        run: make install-tools
      - name: Check the recorded toolchain versions
        run: make toolchain-check TOOLS="node npm"
      # Each artifact goes into conformance-evidence/<artifact name>, so no evidence file of one job replaces a file of
      # another with the same name; scripts/check-conformance.mts reads the directory with its subdirectories.
      - name: Collect the evidence of every suite
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: conformance-evidence-*
          path: conformance-evidence
      - name: Run the checks and write their report
        if: ${{ !cancelled() }}
        run: make ci-targets TARGETS="check-conformance"
      - name: Upload the report of the checks
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-conformance
          path: var/report/ci-targets
          if-no-files-found: error
  ci-passed:
    if: ${{ always() }}
    needs: [build-lint, validator-js, validator-php, validator-go, validator-rust, python, docs-coverage, cross-check-console, cli, form-runtime, form-comparison, form-comparison-pipeline, form-comparison-browser, form-comparison-checks, package-browser, php-engine, native-generators, php-api, conformance]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup the Node.js of mise.toml, which starts the bootstrap
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: 'mise.toml'
      - name: Cache the npm packages of package-lock.json
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Install the npm of packageManager into var/tools
        run: make install-tools TOOLS="npm"
      - name: Install the packages of package-lock.json, @polyspec/kit included
        run: make install-packages
      - name: Install the tools of mise.lock into var/tools/mise and the Rust toolchain of rust-toolchain.toml
        run: make install-tools
      - name: Check the recorded toolchain versions
        run: make toolchain-check TOOLS="node npm"
      - name: Fail unless every other job succeeded
        run: make ci-passed RESULTS='${{ toJSON(needs) }}'
