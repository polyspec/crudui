# Build, validation, rendering and documentation checks.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The toolchains of the checkout at their recorded versions (docs/spec/package-build.md): rustup installs nothing on the
# first cargo, and go never downloads the toolchain of a go.mod.
env:
  RUSTUP_AUTO_INSTALL: '0'
  GOTOOLCHAIN: local

jobs:
  build-lint:
    name: build, lint and types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup the Node.js release of .node-version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Install the recorded npm into the checkout
        run: |
          node scripts/install-npm.mjs
          echo "$PWD/.tools/npm/node_modules/.bin" >> "$GITHUB_PATH"
      # The runtime checks compare every running tool with the version that the checkout records.
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          tools: composer:2.10.3
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: '.go-version'
          cache: false
      - name: Install the Rust toolchain of rust-toolchain.toml
        run: rustup toolchain install --no-self-update
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.9'
      - name: Check the recorded toolchain versions
        run: node scripts/check-toolchain.mjs node npm go rust php python composer
      - name: Install workspace dependencies
        run: npm ci --strict-allow-scripts
      - name: Verify exact runtime versions and test standards
        if: ${{ !cancelled() }}
        run: npm run test:runtimes
      - name: Verify dependency graph and advisories
        if: ${{ !cancelled() }}
        run: npm run test:dependencies
      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build
      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint
      - name: Type-check
        if: ${{ !cancelled() }}
        run: npm run typecheck
      - name: Test the processor checks of tests/ordered-json
        if: ${{ !cancelled() }}
        run: make test-ordered-json

  validator-js:
    name: validator · JavaScript
    runs-on: ubuntu-24.04
    env:
      CRUDUI_CONFORMANCE_EVIDENCE: ${{ github.workspace }}/conformance-evidence
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup the Node.js release of .node-version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Install the recorded npm into the checkout
        run: |
          node scripts/install-npm.mjs
          echo "$PWD/.tools/npm/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Check the recorded toolchain versions
        run: node scripts/check-toolchain.mjs node npm
      - name: Install workspace dependencies
        run: npm ci --strict-allow-scripts
      - name: Test
        if: ${{ !cancelled() }}
        run: npm test -w @crudui/validator
      - name: Preserve conformance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-evidence-validator-js
          path: conformance-evidence/
          if-no-files-found: error

  validator-php:
    name: validator · PHP (${{ matrix.php }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    env:
      CRUDUI_CONFORMANCE_EVIDENCE: ${{ github.workspace }}/conformance-evidence
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup the Node.js release of .node-version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:2.10.3
      - name: Check the recorded toolchain versions
        run: node scripts/check-toolchain.mjs node php composer
      - name: Install PHP dependencies
        run: composer --working-dir=packages/validator-php install --no-interaction --prefer-dist
      - name: Test
        if: ${{ !cancelled() }}
        run: composer --working-dir=packages/validator-php test
      - name: Preserve conformance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-evidence-validator-php-${{ matrix.php }}
          path: conformance-evidence/
          if-no-files-found: error

  validator-go:
    name: validator · Go
    runs-on: ubuntu-24.04
    env:
      CRUDUI_CONFORMANCE_EVIDENCE: ${{ github.workspace }}/conformance-evidence
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup the Node.js release of .node-version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: '.go-version'
          cache-dependency-path: packages/validator-go/go.mod
      - name: Check the recorded toolchain versions
        run: node scripts/check-toolchain.mjs node go
      - name: Test
        if: ${{ !cancelled() }}
        run: node scripts/run-tests.mjs go --cwd packages/validator-go -- ./...
      - name: Preserve conformance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-evidence-validator-go
          path: conformance-evidence/
          if-no-files-found: error

  validator-rust:
    name: validator · Rust
    runs-on: ubuntu-24.04
    env:
      CRUDUI_CONFORMANCE_EVIDENCE: ${{ github.workspace }}/conformance-evidence
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup the Node.js release of .node-version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Install the Rust toolchain of rust-toolchain.toml
        run: rustup toolchain install --no-self-update
      - name: Check the recorded toolchain versions
        run: node scripts/check-toolchain.mjs node rust
      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: packages/validator-rust
      - name: Test
        if: ${{ !cancelled() }}
        run: node scripts/run-tests.mjs cargo -- --locked --manifest-path packages/validator-rust/Cargo.toml
      - name: Preserve conformance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-evidence-validator-rust
          path: conformance-evidence/
          if-no-files-found: error

  docs-coverage:
    name: documentation gate
    runs-on: ubuntu-24.04
    env:
      DOCS_BASE_PATH: /crudui/
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup the Node.js release of .node-version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          tools: composer:2.10.3
      - name: Install PHP dependencies
        run: |
          composer --working-dir=packages/validator-php install --no-interaction --prefer-dist
          composer --working-dir=packages/generator-php install --no-interaction --prefer-dist
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: '.go-version'
          cache-dependency-path: packages/validator-go/go.mod
      - name: Install the Rust toolchain of rust-toolchain.toml
        run: rustup toolchain install --no-self-update
      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: packages/validator-rust
      - name: Install the recorded npm into the checkout
        run: |
          node scripts/install-npm.mjs
          echo "$PWD/.tools/npm/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Check the recorded toolchain versions
        run: node scripts/check-toolchain.mjs node npm go rust php composer
      - name: Install workspace dependencies
        run: npm ci --strict-allow-scripts
      - name: Install PHP API documentation generator
        run: sh scripts/install-phpdocumentor.sh
      - name: Download the crates of every Cargo.lock
        run: make install-crates
      - name: Documentation gate (documents and libraries in four languages)
        if: ${{ !cancelled() }}
        run: make docs-check
      - name: Upload documentation web
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: docs/.web/dist

  deploy-docs:
    name: Deploy documentation to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: docs-coverage
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation web
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  cross-check-console:
    name: cross-check console gateway
    runs-on: ubuntu-24.04
    env:
      CRUDUI_CONFORMANCE_EVIDENCE: ${{ github.workspace }}/conformance-evidence
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup the Node.js release of .node-version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          tools: composer:2.10.3
      - name: Install PHP dependencies
        run: composer --working-dir=packages/validator-php install --no-interaction --prefer-dist
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: '.go-version'
          cache-dependency-path: |
            packages/validator-go/go.mod
            examples/cross-check-console/validators/go/go.mod
      - name: Install the Rust toolchain of rust-toolchain.toml
        run: rustup toolchain install --no-self-update
      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: examples/cross-check-console/validators/rust
      - name: Install the recorded npm into the checkout
        run: |
          node scripts/install-npm.mjs
          echo "$PWD/.tools/npm/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Check the recorded toolchain versions
        run: node scripts/check-toolchain.mjs node npm go rust php composer
      - name: Install workspace dependencies
        run: npm ci --strict-allow-scripts
      - name: Build the packages and the PHP extension
        if: ${{ !cancelled() }}
        run: make build-php-extension
        env:
          PHP_EXTENSION_PHP_CONFIG: /usr/bin/php-config8.5
      - name: Gateway conformance
        if: ${{ !cancelled() }}
        run: npm test --prefix examples/cross-check-console/server
      - name: Feature verification commands
        if: ${{ !cancelled() }}
        run: npm run manifest:test
      - name: Preserve conformance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-evidence-cross-check-console
          path: conformance-evidence/
          if-no-files-found: error

  cli:
    name: command-line interface
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup the Node.js release of .node-version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Install the recorded npm into the checkout
        run: |
          node scripts/install-npm.mjs
          echo "$PWD/.tools/npm/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Check the recorded toolchain versions
        run: node scripts/check-toolchain.mjs node npm
      - name: Install workspace dependencies
        run: npm ci --strict-allow-scripts
      - name: Build the packages
        if: ${{ !cancelled() }}
        run: node scripts/require-current-build.mjs
      - name: Test
        if: ${{ !cancelled() }}
        run: npm test -w @crudui/cli

  form-runtime:
    name: Form instances and data injection
    runs-on: ubuntu-24.04
    env:
      CRUDUI_CONFORMANCE_EVIDENCE: ${{ github.workspace }}/conformance-evidence
      # The Chrome and Firefox builds that puppeteer pins, in the checkout (scripts/install-browsers.mjs).
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/.tools/puppeteer
      CHROME_DEVEL_SANDBOX: /usr/local/sbin/chrome-devel-sandbox
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup the Node.js release of .node-version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Install the recorded npm into the checkout
        run: |
          node scripts/install-npm.mjs
          echo "$PWD/.tools/npm/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Check the recorded toolchain versions
        run: node scripts/check-toolchain.mjs node npm
      - name: Install workspace dependencies
        run: npm ci --strict-allow-scripts
      - name: Install the browsers that Puppeteer and Playwright pin
        run: node scripts/install-browsers.mjs chrome firefox webkit --with-deps --chrome-sandbox
      - name: Verify sandboxed Chrome
        run: node scripts/check-ci-browser.mjs
      - if: ${{ !cancelled() }}
        run: npm run manifest:check
      - if: ${{ !cancelled() }}
        run: npm run manifest:docs:check
      - if: ${{ !cancelled() }}
        run: npm run test:forms
      - name: Preserve conformance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-evidence-form-runtime
          path: conformance-evidence/
          if-no-files-found: error

  form-comparison:
    name: Form comparison runner regressions
    runs-on: ubuntu-24.04
    env:
      # The Chrome and Firefox builds that puppeteer pins, in the checkout (scripts/install-browsers.mjs).
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/.tools/puppeteer
      CHROME_DEVEL_SANDBOX: /usr/local/sbin/chrome-devel-sandbox
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup the Node.js release of .node-version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          tools: composer:2.10.3
      - name: Install the recorded npm into the checkout
        run: |
          node scripts/install-npm.mjs
          echo "$PWD/.tools/npm/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Check the recorded toolchain versions
        run: node scripts/check-toolchain.mjs node npm php composer
      - name: Install workspace and PHP dependencies
        run: |
          npm ci --strict-allow-scripts
          composer --working-dir=packages/validator-php install --no-interaction --prefer-dist
          composer --working-dir=packages/generator-php install --no-interaction --prefer-dist
      - name: Install the browsers that Puppeteer pins
        run: node scripts/install-browsers.mjs chrome --chrome-sandbox
      - name: Verify sandboxed Chrome
        run: node scripts/check-ci-browser.mjs
      - name: Test report policy, browser jobs and source tree
        if: ${{ !cancelled() }}
        run: npm run test:form-comparison

  form-comparison-pipeline:
    name: Record stores and the canonical flow
    runs-on: ubuntu-24.04
    env:
      # The Chrome and Firefox builds that puppeteer pins, in the checkout (scripts/install-browsers.mjs).
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/.tools/puppeteer
      CHROME_DEVEL_SANDBOX: /usr/local/sbin/chrome-devel-sandbox
      PHP_EXTENSION_PHP_CONFIG: /usr/bin/php-config8.5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup the Node.js release of .node-version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          tools: composer:2.10.3
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: '.go-version'
          cache-dependency-path: examples/form-comparison/servers/go/go.mod
      - name: Install the Rust toolchain of rust-toolchain.toml
        run: rustup toolchain install --no-self-update
      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: examples/form-comparison/servers/rust
      - name: Install the recorded npm into the checkout
        run: |
          node scripts/install-npm.mjs
          echo "$PWD/.tools/npm/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Check the recorded toolchain versions
        run: node scripts/check-toolchain.mjs node npm go rust php composer
      - name: Install workspace and PHP dependencies
        run: |
          npm ci --strict-allow-scripts
          composer --working-dir=packages/validator-php install --no-interaction --prefer-dist
          composer --working-dir=packages/generator-php install --no-interaction --prefer-dist
      - name: Install nginx
        # The PHP record servers run on PHP-FPM behind nginx (examples/form-comparison/servers/php);
        # setup-php provides php-fpm on the PATH.
        run: |
          sudo apt-get install -y --no-install-recommends nginx
          php-fpm -v && nginx -v
      - name: Install the browsers that Puppeteer pins
        run: node scripts/install-browsers.mjs chrome --chrome-sandbox
      - name: Verify sandboxed Chrome
        run: node scripts/check-ci-browser.mjs
      - name: Install the pinned OrderedJSON checkout
        run: make install-ordered-json
      - name: Test the five record stores and the canonical flow
        if: ${{ !cancelled() }}
        run: npm run test:form-comparison:pipeline

  package-browser:
    name: Packages, public builds and browser inspector
    runs-on: ubuntu-24.04
    env:
      # The Chrome and Firefox builds that puppeteer pins, in the checkout (scripts/install-browsers.mjs).
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/.tools/puppeteer
      CHROME_DEVEL_SANDBOX: /usr/local/sbin/chrome-devel-sandbox
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup the Node.js release of .node-version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Install the recorded npm into the checkout
        run: |
          node scripts/install-npm.mjs
          echo "$PWD/.tools/npm/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Check the recorded toolchain versions
        run: node scripts/check-toolchain.mjs node npm
      - name: Install workspace dependencies
        run: npm ci --strict-allow-scripts
      - name: Install the browsers that Puppeteer pins
        run: node scripts/install-browsers.mjs chrome --chrome-sandbox
      - name: Verify sandboxed Chrome
        run: node scripts/check-ci-browser.mjs
      - name: Pack and test package installs
        if: ${{ !cancelled() }}
        run: npm run test:packages
      - name: Test public package exports and types
        if: ${{ !cancelled() }}
        run: npm run test:build
      - name: Test reproducible builds
        if: ${{ !cancelled() }}
        run: npm run test:build:repeat
      - name: Test the form inspector
        if: ${{ !cancelled() }}
        run: npm run test:inspector

  native-generators:
    name: Native generation and PHP API (${{ matrix.php }})
    runs-on: ubuntu-24.04
    env:
      CRUDUI_CONFORMANCE_EVIDENCE: ${{ github.workspace }}/conformance-evidence
      # The Chrome and Firefox builds that puppeteer pins, in the checkout (scripts/install-browsers.mjs).
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/.tools/puppeteer
      CHROME_DEVEL_SANDBOX: /usr/local/sbin/chrome-devel-sandbox
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup the Node.js release of .node-version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.node-version'
          cache: npm
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:2.10.3
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: '.go-version'
          cache-dependency-path: |
            packages/generator-go/go.mod
            tests/native-generators/programs/go/go.mod
            tools/bench/go/go.mod
      - name: Install the Rust toolchain of rust-toolchain.toml
        run: rustup toolchain install --no-self-update
      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            packages/generator-rust
            tests/native-generators/programs/rust
            tools/bench/rust
      - name: Install the recorded npm into the checkout
        run: |
          node scripts/install-npm.mjs
          echo "$PWD/.tools/npm/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Check the recorded toolchain versions
        run: node scripts/check-toolchain.mjs node npm go rust php composer
      - name: Install dependencies
        run: |
          npm ci --strict-allow-scripts
          composer --working-dir=packages/validator-php install --no-interaction --prefer-dist
          composer --working-dir=packages/generator-php install --no-interaction --prefer-dist
      - name: Install the browsers that Puppeteer pins
        run: node scripts/install-browsers.mjs chrome --chrome-sandbox
      - name: Verify sandboxed Chrome
        run: node scripts/check-ci-browser.mjs
      - name: Download the crates of every Cargo.lock
        run: make install-crates
      - name: Build and test native packages
        if: ${{ !cancelled() }}
        run: make test-native
        env:
          PHP_EXTENSION_PHP_CONFIG: /usr/bin/php-config${{ matrix.php }}
      - name: Test the benchmark drivers
        if: ${{ !cancelled() }}
        run: npm run test:bench
      - name: Preserve comparison report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-generators-php-${{ matrix.php }}
          path: .git/native-generators/report.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Preserve conformance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-evidence-native-php-${{ matrix.php }}
          path: conformance-evidence/
          if-no-files-found: error

  conformance:
    name: conformance evidence against the standard
    needs: [validator-js, validator-php, validator-go, validator-rust, cross-check-console, form-runtime, native-generators]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup the Node.js release of .node-version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Check the recorded toolchain versions
        run: node scripts/check-toolchain.mjs node
      - name: Collect the evidence of every suite
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: conformance-evidence-*
          path: conformance-evidence
          merge-multiple: true
      - name: Check the evidence
        if: ${{ !cancelled() }}
        run: node scripts/check-conformance.mjs
        env:
          CRUDUI_CONFORMANCE_EVIDENCE: conformance-evidence
