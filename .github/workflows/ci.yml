      - name: Cache the npm packages of package-lock.json
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Install the npm of packageManager into var/tools
        run: make install-tools TOOLS="npm"
      - name: Install the packages of package-lock.json, @polyspec/kit included
        run: make install-packages
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version-file: .php-version
          tools: none
      - name: Install the tools of mise.lock into var/tools/mise and the Rust toolchain of rust-toolchain.toml
        run: make install-tools
      - name: Check the recorded toolchain versions
        run: make toolchain-check TOOLS="node npm php composer"
      - name: Install PHP dependencies
        run: make crudui-install-composer
      - name: Run the checks and write their report
        if: ${{ !cancelled() }}
        run: make ci-targets TARGETS="crudui-test-validator-php"
      - name: Upload the report of the checks
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-validator-php
          path: var/report/ci-targets
          if-no-files-found: error
      - name: Preserve conformance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-evidence-validator-php
          path: conformance-evidence/
          if-no-files-found: error

  validator-go:
    name: validator · Go
    runs-on: ubuntu-24.04
    env:
      CRUDUI_CONFORMANCE_EVIDENCE: ${{ github.workspace }}/conformance-evidence
    steps:
