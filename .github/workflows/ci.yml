# Build, validation, rendering and documentation checks.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-lint:
    name: build, lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        timeout-minutes: 5
      - name: Setup selected Node.js release line
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: npm
        timeout-minutes: 5
      - name: Install workspace dependencies
        run: npm i -g npm@latest && npm ci --strict-allow-scripts
        timeout-minutes: 10
      - name: Verify runtime version channels and test standards
        run: npm run test:runtimes
      - name: Verify dependency graph and advisories
        run: npm run test:dependencies
      - name: Build
        run: npm run build
        timeout-minutes: 10
      - name: Lint
        run: npm run lint
        timeout-minutes: 10
      - name: Type-check
        run: npm run typecheck
        timeout-minutes: 10

  validator-js:
    name: validator · JavaScript
    runs-on: ubuntu-latest
    env:
      CRUDUI_CONFORMANCE_EVIDENCE: ${{ github.workspace }}/conformance-evidence
    steps:
      - uses: actions/checkout@v6
        timeout-minutes: 5
      - name: Setup selected Node.js release line
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: npm
        timeout-minutes: 5
      - name: Install workspace dependencies
        run: npm i -g npm@latest && npm ci --strict-allow-scripts
        timeout-minutes: 10
      - name: Test
        run: npm test -w @crudui/validator
      - name: Preserve conformance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: conformance-evidence-validator-js
          path: conformance-evidence/
          if-no-files-found: error
        timeout-minutes: 5

  validator-php:
    name: validator · PHP (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    env:
      CRUDUI_CONFORMANCE_EVIDENCE: ${{ github.workspace }}/conformance-evidence
    steps:
      - uses: actions/checkout@v6
        timeout-minutes: 5
      - name: Setup selected Node.js release line
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: npm
        timeout-minutes: 5
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
        timeout-minutes: 5
      - name: Install PHP dependencies
        run: composer --working-dir=packages/validator-php install --no-interaction --prefer-dist
        timeout-minutes: 10
      - name: Test
        run: composer --working-dir=packages/validator-php test
      - name: Preserve conformance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: conformance-evidence-validator-php-${{ matrix.php }}
          path: conformance-evidence/
          if-no-files-found: error
        timeout-minutes: 5

  validator-go:
    name: validator · Go
    runs-on: ubuntu-latest
    env:
      CRUDUI_CONFORMANCE_EVIDENCE: ${{ github.workspace }}/conformance-evidence
    steps:
      - uses: actions/checkout@v6
        timeout-minutes: 5
      - name: Setup selected Node.js release line
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: npm
        timeout-minutes: 5
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: '.go-version'
          cache-dependency-path: packages/validator-go/go.mod
        timeout-minutes: 5
      - name: Test
        run: node scripts/run-tests.mjs go --cwd packages/validator-go -- ./...
      - name: Preserve conformance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: conformance-evidence-validator-go
          path: conformance-evidence/
          if-no-files-found: error
        timeout-minutes: 5

  validator-rust:
    name: validator · Rust
    runs-on: ubuntu-latest
    env:
      CRUDUI_CONFORMANCE_EVIDENCE: ${{ github.workspace }}/conformance-evidence
    steps:
      - uses: actions/checkout@v6
        timeout-minutes: 5
      - name: Setup selected Node.js release line
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: npm
        timeout-minutes: 5
      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 5
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/validator-rust
        timeout-minutes: 5
      - name: Test
        run: node scripts/run-tests.mjs cargo -- --locked --manifest-path packages/validator-rust/Cargo.toml
      - name: Preserve conformance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: conformance-evidence-validator-rust
          path: conformance-evidence/
          if-no-files-found: error
        timeout-minutes: 5

  docs-coverage:
    name: documentation gate
    runs-on: ubuntu-latest
    env:
      DOCS_BASE_PATH: /crudui/
    steps:
      - uses: actions/checkout@v6
        timeout-minutes: 5
      - name: Setup selected Node.js release line
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: npm
        timeout-minutes: 5
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer
        timeout-minutes: 5
      - name: Install PHP dependencies
        run: |
          composer --working-dir=packages/validator-php install --no-interaction --prefer-dist
          composer --working-dir=packages/generator-php install --no-interaction --prefer-dist
        timeout-minutes: 10
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: '.go-version'
          cache-dependency-path: packages/validator-go/go.mod
        timeout-minutes: 5
      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 5
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/validator-rust
        timeout-minutes: 5
      - name: Install workspace dependencies
        run: npm i -g npm@latest && npm ci --strict-allow-scripts
        timeout-minutes: 10
      - name: Install PHP API documentation generator
        run: sh scripts/install-phpdocumentor.sh
        timeout-minutes: 10
      - name: Documentation gate (documents and libraries in four languages)
        run: make docs-check
      - name: Upload documentation web
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/.web/dist
        timeout-minutes: 5

  deploy-docs:
    name: Deploy documentation to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: docs-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation web
        id: deployment
        uses: actions/deploy-pages@v4

  cross-check-console:
    name: cross-check console gateway
    runs-on: ubuntu-latest
    env:
      CRUDUI_CONFORMANCE_EVIDENCE: ${{ github.workspace }}/conformance-evidence
    steps:
      - uses: actions/checkout@v6
        timeout-minutes: 5
      - name: Setup selected Node.js release line
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: npm
        timeout-minutes: 5
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer
        timeout-minutes: 5
      - name: Install PHP dependencies
        run: composer --working-dir=packages/validator-php install --no-interaction --prefer-dist
        timeout-minutes: 10
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: '.go-version'
          cache-dependency-path: |
            packages/validator-go/go.mod
            examples/cross-check-console/validators/go/go.mod
        timeout-minutes: 5
      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 5
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/cross-check-console/validators/rust
        timeout-minutes: 5
      - name: Install workspace dependencies
        run: npm i -g npm@latest && npm ci --strict-allow-scripts
        timeout-minutes: 10
      - name: Build the packages and the PHP extension
        run: make build-php-extension
        env:
          PHP_EXTENSION_PHP_CONFIG: /usr/bin/php-config8.5
        timeout-minutes: 10
      - name: Gateway conformance
        run: npm test --prefix examples/cross-check-console/server
      - name: Feature verification commands
        run: npm run manifest:test
      - name: Preserve conformance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: conformance-evidence-cross-check-console
          path: conformance-evidence/
          if-no-files-found: error
        timeout-minutes: 5

  cli:
    name: command-line interface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        timeout-minutes: 5
      - name: Setup selected Node.js release line
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: npm
        timeout-minutes: 5
      - name: Install workspace dependencies
        run: npm i -g npm@latest && npm ci --strict-allow-scripts
        timeout-minutes: 10
      - name: Build the packages
        run: node scripts/require-current-build.mjs
        timeout-minutes: 10
      - name: Test
        run: npm test -w @crudui/cli

  form-runtime:
    name: Form instances and data injection
    runs-on: ubuntu-latest
    env:
      CRUDUI_CONFORMANCE_EVIDENCE: ${{ github.workspace }}/conformance-evidence
      PUPPETEER_EXECUTABLE_PATH: /opt/google/chrome/chrome
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v6
        timeout-minutes: 5
      - name: Setup selected Node.js release line
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: npm
        timeout-minutes: 5
      - name: Install workspace dependencies
        run: npm i -g npm@latest && npm ci --strict-allow-scripts
        timeout-minutes: 10
      - name: Install WebKit for the browser checks
        run: npx playwright install --with-deps webkit
        timeout-minutes: 10
      - name: Verify sandboxed Chrome
        run: node scripts/check-ci-browser.mjs
        timeout-minutes: 10
      - run: npm run manifest:check
        timeout-minutes: 10
      - run: npm run manifest:docs:check
        timeout-minutes: 10
      - run: npm run test:forms
      - name: Preserve conformance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: conformance-evidence-form-runtime
          path: conformance-evidence/
          if-no-files-found: error
        timeout-minutes: 5

  form-comparison:
    name: Form comparison runner regressions
    runs-on: ubuntu-latest
    env:
      PUPPETEER_EXECUTABLE_PATH: /opt/google/chrome/chrome
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v6
        timeout-minutes: 5
      - name: Setup selected Node.js release line
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: npm
        timeout-minutes: 5
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer
        timeout-minutes: 5
      - name: Install workspace and PHP dependencies
        run: |
          npm i -g npm@latest && npm ci --strict-allow-scripts
          composer --working-dir=packages/validator-php install --no-interaction --prefer-dist
          composer --working-dir=packages/generator-php install --no-interaction --prefer-dist
        timeout-minutes: 10
      - name: Verify sandboxed Chrome
        run: node scripts/check-ci-browser.mjs
        timeout-minutes: 10
      - name: Test report policy, browser jobs and source tree
        run: npm run test:form-comparison

  form-comparison-pipeline:
    name: Record stores and the canonical flow
    runs-on: ubuntu-latest
    env:
      PUPPETEER_EXECUTABLE_PATH: /opt/google/chrome/chrome
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      PHP_EXTENSION_PHP_CONFIG: /usr/bin/php-config8.5
    steps:
      - uses: actions/checkout@v6
        timeout-minutes: 5
      - name: Setup selected Node.js release line
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: npm
        timeout-minutes: 5
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer
        timeout-minutes: 5
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: '.go-version'
          cache-dependency-path: examples/form-comparison/servers/go/go.mod
        timeout-minutes: 5
      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 5
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/form-comparison/servers/rust
        timeout-minutes: 5
      - name: Install workspace and PHP dependencies
        run: |
          npm i -g npm@latest && npm ci --strict-allow-scripts
          composer --working-dir=packages/validator-php install --no-interaction --prefer-dist
          composer --working-dir=packages/generator-php install --no-interaction --prefer-dist
        timeout-minutes: 10
      - name: Install nginx
        # The PHP record servers run on PHP-FPM behind nginx (examples/form-comparison/servers/php);
        # setup-php provides php-fpm on the PATH.
        run: |
          sudo apt-get install -y --no-install-recommends nginx
          php-fpm -v && nginx -v
        timeout-minutes: 10
      - name: Verify sandboxed Chrome
        run: node scripts/check-ci-browser.mjs
        timeout-minutes: 10
      - name: Test the five record stores and the canonical flow
        run: npm run test:form-comparison:pipeline

  package-browser:
    name: Packages, public builds and browser inspector
    runs-on: ubuntu-latest
    env:
      PUPPETEER_EXECUTABLE_PATH: /opt/google/chrome/chrome
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v6
        timeout-minutes: 5
      - name: Setup selected Node.js release line
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: npm
        timeout-minutes: 5
      - name: Install workspace dependencies
        run: npm i -g npm@latest && npm ci --strict-allow-scripts
        timeout-minutes: 10
      - name: Verify sandboxed Chrome
        run: node scripts/check-ci-browser.mjs
        timeout-minutes: 10
      - name: Pack and test package installs
        run: npm run test:packages
      - name: Test public package exports, types and reproducible builds
        run: npm run test:build && npm run test:build:repeat
      - name: Test the form inspector
        run: npm run test:inspector

  native-generators:
    name: Native generation and PHP API (${{ matrix.php }})
    runs-on: ubuntu-latest
    env:
      CRUDUI_CONFORMANCE_EVIDENCE: ${{ github.workspace }}/conformance-evidence
      PUPPETEER_EXECUTABLE_PATH: /opt/google/chrome/chrome
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v6
        timeout-minutes: 5
      - name: Setup selected Node.js release line
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: npm
        timeout-minutes: 5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
        timeout-minutes: 5
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: '.go-version'
          cache-dependency-path: |
            packages/generator-go/go.mod
            tests/native-generators/programs/go/go.mod
            tools/bench/go/go.mod
        timeout-minutes: 5
      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 5
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/generator-rust
            tests/native-generators/programs/rust
            tools/bench/rust
        timeout-minutes: 5
      - name: Install dependencies
        run: |
          npm i -g npm@latest && npm ci --strict-allow-scripts
          composer --working-dir=packages/validator-php install --no-interaction --prefer-dist
          composer --working-dir=packages/generator-php install --no-interaction --prefer-dist
        timeout-minutes: 10
      - name: Verify sandboxed Chrome
        run: node scripts/check-ci-browser.mjs
        timeout-minutes: 10
      - name: Build and test native packages
        run: make test-native
        env:
          PHP_EXTENSION_PHP_CONFIG: /usr/bin/php-config${{ matrix.php }}
      - name: Test the benchmark drivers
        run: npm run test:bench
      - name: Preserve comparison report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: native-generators-php-${{ matrix.php }}
          path: .git/native-generators/report.json
          include-hidden-files: true
          if-no-files-found: error
        timeout-minutes: 5
      - name: Preserve conformance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: conformance-evidence-native-php-${{ matrix.php }}
          path: conformance-evidence/
          if-no-files-found: error
        timeout-minutes: 5

  conformance:
    name: conformance evidence against the standard
    needs: [validator-js, validator-php, validator-go, validator-rust, cross-check-console, form-runtime, native-generators]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Setup selected Node.js release line
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Collect the evidence of every suite
        uses: actions/download-artifact@v8
        with:
          pattern: conformance-evidence-*
          path: conformance-evidence
          merge-multiple: true
      - name: Check the evidence
        run: node scripts/check-conformance.mjs
        env:
          CRUDUI_CONFORMANCE_EVIDENCE: conformance-evidence
