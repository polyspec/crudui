# Build, validation, rendering and documentation checks of every push to main and of every manual run. The last job
# ci-passed needs every other job and fails unless each of them succeeded; a release requires it and push-gate to have
# succeeded for the tagged commit (docs/operations/repository.md). The documentation web of main is deployed by
# .github/workflows/pages.yml.

name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

# The run of a commit of main is never cancelled by a later push: a release requires the checks of its own commit
# (tests/build/ci-local.test.mts).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# The toolchains of the checkout at their recorded versions (docs/operations/package-build.md): rustup installs nothing on the
# first cargo, and go never downloads the toolchain of a go.mod.
env:
  RUSTUP_AUTO_INSTALL: '0'
  GOTOOLCHAIN: local

jobs:
  build-lint:
    name: build, lint and types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup the Node.js of mise.toml, which starts the bootstrap
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: 'mise.toml'
      - name: Cache the npm packages of package-lock.json
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Install the npm of packageManager into var/tools
        run: make install-tools TOOLS="npm"
      - name: Install the packages of package-lock.json, @polyspec/kit included
        run: make install-packages
      # The runtime checks compare every running tool with the version that the checkout records.
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version-file: .php-version
          tools: none
      - name: Install the tools of mise.lock into var/tools/mise and the Rust toolchain of rust-toolchain.toml
        run: make install-tools
      # make lint-php runs PHPStan with the autoloader of the Composer packages; make crudui-install-composer runs the Composer of
      # mise.toml, which make install-tools installs.
      - name: Install PHP dependencies
        run: make crudui-install-composer
      - name: Download the modules that the Go workspace requires
        run: make crudui-install-go-modules
      - name: Check the recorded toolchain versions
        run: make toolchain-check TOOLS="node npm go rust php python composer"
      # make lint-rust runs cargo clippy offline in each Cargo workspace.
      - name: Download the crates of every Cargo.lock
        run: make crudui-install-crates
      - name: Run the checks and write their report
        if: ${{ !cancelled() }}
        run: make ci-targets TARGETS="crudui-test-runtimes crudui-test-dependencies build lint lint-python lint-php lint-rust lint-go typecheck"
      - name: Upload the report of the checks
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-build-lint
          path: var/report/ci-targets
          if-no-files-found: error
  validator-js:
    name: validator · JavaScript
    runs-on: ubuntu-24.04
    env:
      CRUDUI_CONFORMANCE_EVIDENCE: ${{ github.workspace }}/conformance-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
