        run: make install-packages
      - name: Install the tools of mise.lock into var/tools/mise and the Rust toolchain of rust-toolchain.toml
        run: make install-tools
      - name: Check the recorded toolchain versions
        run: make toolchain-check TOOLS="node npm"
      - name: Run the checks and write their report
        if: ${{ !cancelled() }}
        run: make ci-targets TARGETS="crudui-test-validator-js"
      - name: Upload the report of the checks
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-validator-js
          path: var/report/ci-targets
          if-no-files-found: error
      - name: Preserve conformance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
