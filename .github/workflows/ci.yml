      # The suites and programs import the Python packages installed in var/python (S3).
      - name: Install the Python packages of the uv workspace into var/python
        run: make crudui-install-python
      # The Python is the one of mise.toml, which make install-tools installed at the digest of mise.lock.
      - name: Check the recorded toolchain versions
        run: make toolchain-check TOOLS="node npm python"
      - name: Run the checks and write their report
        if: ${{ !cancelled() }}
        run: make ci-targets TARGETS="crudui-test-validator-python crudui-test-generator-python"
