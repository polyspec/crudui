      - name: Download the modules that the Go workspace requires
        run: make crudui-install-go-modules
      - name: Check the recorded toolchain versions
        run: make toolchain-check TOOLS="node npm go"
      - name: Run the checks and write their report
        if: ${{ !cancelled() }}
