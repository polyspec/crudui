# Build, validation, rendering and documentation checks.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-lint:
    name: build + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup selected Node.js release line
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install workspace deps
        run: npm i -g npm@latest && npm ci --strict-allow-scripts

      - name: Verify runtime version channels
        run: npm run test:runtimes

      - name: Verify dependency graph and advisories
        run: npm run test:dependencies

      - name: Build (validator-ts + generator-react/vue/svelte)
        run: npm run build

      - name: Lint
        run: npm run lint

  cross-language:
    name: cross-language idempotency (1074)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup selected Node.js release line
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer
      - name: Install PHP dependencies
        run: composer --working-dir=packages/validator-php install --no-interaction --prefer-dist

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: '.go-version'
          cache-dependency-path: packages/validator-go/go.mod

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/validator-rust

      - name: Install workspace deps
        run: npm i -g npm@latest && npm ci --strict-allow-scripts

      - name: Build JS validator
        run: npm run build:validator

      - name: Cross-language compare (JS/PHP/Go/Rust, 1074 cases)
        run: npm test

  validator-unit-js:
    name: unit · validator-ts (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup selected Node.js release line
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Install workspace deps
        run: npm i -g npm@latest && npm ci --strict-allow-scripts
      - name: Test
        run: npm test
        working-directory: packages/validator-ts

  validator-unit-php:
    name: unit · validator-php (phpunit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer
      - name: Install PHP dependencies
        run: composer --working-dir=packages/validator-php install --no-interaction --prefer-dist
      - name: Test
        run: composer test
        working-directory: packages/validator-php

  validator-unit-go:
    name: unit · validator-go (go test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: '.go-version'
          cache-dependency-path: packages/validator-go/go.mod
      - name: Test
        run: go test ./...
        working-directory: packages/validator-go

  validator-unit-rust:
    name: unit · validator-rust (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/validator-rust
      - name: Test
        run: cargo test
        working-directory: packages/validator-rust

  parity:
    name: HTML parity (React/Vue/Svelte)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup selected Node.js release line
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install workspace deps
        run: npm i -g npm@latest && npm ci --strict-allow-scripts

      - name: Build generators (validator + react/vue/svelte)
        run: npm run build

      - name: React parity
        run: |
          npm ci --strict-allow-scripts
          npm test
        working-directory: tests/parity

      - name: Vue parity
        run: npm test
        working-directory: packages/generator-vue

      - name: Svelte parity
        run: npm test
        working-directory: packages/generator-svelte

  docs-coverage:
    name: doc-coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup selected Node.js release line
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer
      - name: Install PHP dependencies
        run: |
          composer --working-dir=packages/validator-php install --no-interaction --prefer-dist
          composer --working-dir=packages/generator-php install --no-interaction --prefer-dist

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: '.go-version'
          cache-dependency-path: packages/validator-go/go.mod

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/validator-rust

      - name: Install workspace deps (typedoc lives here)
        run: npm i -g npm@latest && npm ci --strict-allow-scripts

      - name: Install PHP API documentation generator
        run: sh scripts/install-phpdocumentor.sh

      - name: Doc-coverage gate (libs + servers, 4 langs)
        run: make docs-check

  validator-current-ts:
    name: current · validator-ts (vitest src)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup selected Node.js release line
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Install workspace deps
        run: npm i -g npm@latest && npm ci --strict-allow-scripts
      - name: current conformance (vitest src)
        run: npm run test:current
        working-directory: packages/validator-ts

  validator-current-php:
    name: current · validator-php (phpunit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer
      - name: Install PHP dependencies
        run: composer --working-dir=packages/validator-php install --no-interaction --prefer-dist
      - name: current conformance (phpunit tests)
        run: composer test:current
        working-directory: packages/validator-php

  validator-current-go:
    name: current · validator-go (go test ./validator/... + CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: '.go-version'
          cache-dependency-path: packages/validator-go/go.mod
      - name: current conformance (go test ./validator/... + validate CLI)
        run: go test ./validator/... ./cmd/validate
        working-directory: packages/validator-go

  validator-current-rust:
    name: current · validator-rust (cargo test current conformance + CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/validator-rust
      - name: current conformance (expr/compose/validate/spec-validity/list-validity + validate CLI)
        run: >
          cargo test
          --test expr_conformance
          --test compose_conformance
          --test validate_conformance
          --test spec_validity_conformance
          --test list_validity_conformance
          --test validate_cli_conformance
        working-directory: packages/validator-rust

  form-render:
    name: current render (React/Vue/Svelte SSR — form + list)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup selected Node.js release line
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install workspace deps
        run: npm i -g npm@latest && npm ci --strict-allow-scripts

      - name: Build form packages
        run: npm run build

      - name: React current render
        run: npm run test:current
        working-directory: packages/generator-react

      - name: Vue current render
        run: npm run test:current
        working-directory: packages/generator-vue

      - name: Svelte current render
        run: npm run test:current
        working-directory: packages/generator-svelte

  cross-check-console:
    name: current · cross-check-console gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup selected Node.js release line
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer
      - name: Install PHP dependencies
        run: composer --working-dir=packages/validator-php install --no-interaction --prefer-dist

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: '.go-version'
          cache-dependency-path: packages/validator-go/go.mod

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/validator-rust

      - name: Install workspace deps
        run: npm i -g npm@latest && npm ci --strict-allow-scripts

      - name: Build form packages
        run: npm run build

      - name: Build Go + Rust validate CLIs (gateway spawns them)
        run: npm run build:cli
        working-directory: examples/cross-check-console/server

      - name: Gateway conformance (verdict units + fan-out + HTTP boundary)
        run: npm test
        working-directory: examples/cross-check-console/server

  cli:
    name: current · cli (describe/check/explain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup selected Node.js release line
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install workspace deps
        run: npm i -g npm@latest && npm ci --strict-allow-scripts

      - name: Build validator package
        run: npm run build:validator

      - name: CLI conformance
        run: npm test
        working-directory: packages/cli

  form-runtime:
    name: Form instances and data injection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm i -g npm@latest && npm ci --strict-allow-scripts
      - run: npm run test:forms

  form-comparison:
    name: Form comparison runner regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup selected Node.js release line
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer
      - name: Install workspace deps and Puppeteer Chromium
        run: |
          npm i -g npm@latest && npm ci --strict-allow-scripts
          composer --working-dir=packages/validator-php install --no-interaction --prefer-dist
          composer --working-dir=packages/generator-php install --no-interaction --prefer-dist
      - name: Test report policy, browser jobs and candidate sources
        run: npm run test:form-comparison

  package-browser:
    name: Packages, public builds and browser inspector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup selected Node.js release line
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Install workspace deps and Puppeteer Chromium
        run: npm i -g npm@latest && npm ci --strict-allow-scripts
      - name: Pack and test package consumers
        run: npm run test:packages
      - name: Test public package exports and types
        run: npm run test:build
      - name: Test reproducible package builds
        run: npm run test:build:repeat
      - name: Test form inspector units and browser CSS
        run: |
          node --test tests/form-inspector/form-snapshot.test.mjs
          node tests/form-inspector/browser.mjs

  native-generators:
    name: Native generation and PHP API (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
      - uses: actions/setup-go@v6
        with:
          go-version-file: '.go-version'
          cache-dependency-path: packages/generator-go/go.mod
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/generator-rust
            packages/php-ext
      - name: Install dependencies
        run: |
          npm i -g npm@latest && npm ci --strict-allow-scripts
          composer --working-dir=packages/validator-php install --no-interaction --prefer-dist
          composer --working-dir=packages/generator-php install --no-interaction --prefer-dist
      - name: Build and test native packages
        run: make test-native
        env:
          PHP_EXTENSION_PHP_CONFIG: /usr/bin/php-config${{ matrix.php }}
      - name: Preserve comparison report
        uses: actions/upload-artifact@v4
        with:
          name: native-generators-php-${{ matrix.php }}
          path: .git/native-generators/report.json
          include-hidden-files: true
          if-no-files-found: error
