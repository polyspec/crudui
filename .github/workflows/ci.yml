    name: python
    runs-on: ubuntu-24.04
    env:
      CRUDUI_CONFORMANCE_EVIDENCE: ${{ github.workspace }}/conformance-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup the Node.js of mise.toml, which starts the bootstrap
