  form-runtime:
    name: Form instances and data injection
    runs-on: ubuntu-24.04
    env:
      CRUDUI_CONFORMANCE_EVIDENCE: ${{ github.workspace }}/conformance-evidence
      # The Chrome and Firefox builds that puppeteer pins, in the checkout (scripts/install-browsers.mts).
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/.tools/puppeteer
      CHROME_DEVEL_SANDBOX: /usr/local/sbin/chrome-devel-sandbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup the Node.js of mise.toml, which starts the bootstrap
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: 'mise.toml'
      - name: Cache the npm packages of package-lock.json
