# The documentation web of main on GitHub Pages (docs/operations/repository.md). It builds the documentation web of each
# commit that main receives and deploys it; the environment github-pages deploys only from main.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push to main waits for the running deployment instead of stopping it.
concurrency:
  group: github-pages
  cancel-in-progress: false

# The toolchains of the checkout at their recorded versions (docs/operations/package-build.md): rustup installs nothing on the
# first cargo, and go never downloads the toolchain of a go.mod.
env:
  RUSTUP_AUTO_INSTALL: '0'
  GOTOOLCHAIN: local

jobs:
  docs-web:
    name: documentation web
    runs-on: ubuntu-24.04
    env:
      DOCS_BASE_PATH: /crudui/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup the Node.js of mise.toml, which starts the bootstrap
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: 'mise.toml'
      - name: Cache the npm packages of package-lock.json
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Install the npm of packageManager into var/tools
        run: make install-tools TOOLS="npm"
      - name: Install the packages of package-lock.json, @polyspec/kit included
        run: make install-packages
      # The link of crudui-install-svelte-tools needs the Python environment of var/python (kit's link checks it).
      - name: Install the Python packages of the uv workspace into var/python
        run: make crudui-install-python
      - name: Install the tools of packages/svelte
        run: make crudui-install-svelte-tools
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version-file: .php-version
          tools: none
      - name: Install the tools of mise.lock into var/tools/mise and the Rust toolchain of rust-toolchain.toml
        run: make install-tools
      - name: Install PHP dependencies
        run: make install-composer
      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: packages/validator/rust
      - name: Download the modules that the Go workspace requires
        run: make install-go-modules
      - name: Check the recorded toolchain versions
        run: make toolchain-check TOOLS="node npm go rust php composer"
      - name: Install PHP API documentation generator
        run: make install-phpdocumentor
      - name: Download the crates of every Cargo.lock
        run: make install-crates
      - name: Build the documentation web and write its report
        if: ${{ !cancelled() }}
        run: make ci-targets TARGETS="docs-web"
      - name: Upload the report of the build
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-docs-web
          path: var/report/ci-targets
          if-no-files-found: error
      - name: Upload documentation web
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: docs/.web/dist

  deploy:
    name: Deploy documentation to GitHub Pages
    needs: docs-web
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation web
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
