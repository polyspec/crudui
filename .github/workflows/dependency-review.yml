# The scheduled dependency review (docs/operations/package-build.md, "Dependency review"). It asks the registries for newer
# stable releases and advisories of the committed manifests and locks, and RustSec for the advisories of the Cargo
# locks, and fails with one line for each, naming the package, its version, the newer release or the advisory and the
# fix command. It gates no commit: the checks of the CI workflow read only the files of the tree and the review record
# config/dependency-review.json.
name: Dependency review

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Dependency review prepares the declared runtime and audit tools before online registry queries.
env:
  RUSTUP_AUTO_INSTALL: '0'
  GOTOOLCHAIN: local

jobs:
  review:
    name: dependency review
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup the Node.js of mise.toml, which starts the bootstrap
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: 'mise.toml'
          package-manager-cache: false
      - name: Cache the npm packages of package-lock.json
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Bootstrap the installed kit package
        run: |
          npm_config_cache="$PWD/var/bootstrap/npm-cache" npm exec --yes --package="$(node -p 'require("./package.json").packageManager.split("+")[0]')" -- npm ci --ignore-scripts --allow-remote=root
      - name: Install the npm of packageManager into var/tools
        run: make install-tools TOOLS="npm"
      - name: Install the packages of package-lock.json, @polyspec/kit included
        run: make install-packages
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version-file: .php-version
          tools: none
      - name: Install the tools of mise.lock into var/tools/mise and the Rust toolchain of rust-toolchain.toml
        run: make install-tools
      - name: Check the recorded toolchain versions
        run: make toolchain-check TOOLS="node npm rust php composer"
      - name: Review the dependencies
        if: ${{ !cancelled() }}
        run: make ci-targets TARGETS="crudui-review-dependencies"
      - name: Upload the report of the checks
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-dependency-review
          path: var/report/ci-targets
          if-no-files-found: error
