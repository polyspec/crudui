# Weekly dependency updates across every ecosystem this repo ships.
# Grouped to keep PR noise low: one PR per ecosystem per week, not one per dep.
version: 2
updates:
  # GitHub Actions used by ci.yml (checkout, setup-node/go/php/rust, caches).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # Root npm workspace (validator-js + generators resolve through here).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']

  # React HTML parity harness has its own lockfile.
  - package-ecosystem: npm
    directory: /tests/parity
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']

  # Go validator module.
  - package-ecosystem: gomod
    directory: /packages/validator-go
    schedule:
      interval: weekly

  # Rust validator crate.
  - package-ecosystem: cargo
    directory: /packages/validator-rust
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ['*']

  # PHP validator (committed vendor/, Composer-managed).
  - package-ecosystem: composer
    directory: /packages/validator-php
    schedule:
      interval: weekly
