[package]
name = "polyspec-crudui-cross-check-validator"
version = "0.0.5"
edition = "2021"
rust-version = "1.99.0"
publish = false

[dependencies]
polyspec-crudui-validator = { path = "../../../../packages/validator/rust" }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[profile.release]
# Keep release artifacts unstripped. Cargo's debuginfo strip invokes the
# toolchain's rust-objcopy, whose macOS distribution may lack libLLVM.dylib.
# The build must not report a successful binary after that step fails.
strip = "none"

[lints]
workspace = true

[workspace]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"
