[package]
name = "crudui-cross-check-validator"
version = "0.0.1"
edition = "2021"
publish = false

[dependencies]
crudui-validator = { path = "../../../../packages/validator-rust" }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[profile.release]
# Keep release artifacts unstripped. Cargo's debuginfo strip invokes the
# toolchain's rust-objcopy, whose macOS distribution may lack libLLVM.dylib.
# The build must not report a successful binary after that step fails.
strip = "none"
