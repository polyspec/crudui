<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CRUDUI · Pipeline example</title><link rel="stylesheet" href="/comparison.css"></head>
<body class="pipeline">
  <header class="site-header"><a class="brand" href="/">CRUDUI</a><span>pipeline example</span><a href="/benchmark/">benchmark</a><a id="language" href="?lang=en">English</a></header>
  <main class="pipeline-shell">
    <section class="hero"><p class="eyebrow">CRUDUI EXAMPLE</p><h1 id="title"></h1><p id="intro"></p><p id="pagination-contract" class="contract-note"></p></section>
    <nav class="pipeline-nav" aria-label="CRUDUI pipeline"><a data-view="list" href="/">List</a><a data-view="detail" href="/detail?id=1">Detail</a><a data-view="form" href="/form?id=1">Form</a></nav>
    <section class="controls" aria-label="Runtime selection"><div class="control"><label for="server" id="server-label"></label><select id="server"><option value="js">JavaScript</option><option value="php">PHP</option><option value="php-ext">PHP extension</option><option value="go">Go</option><option value="rust">Rust</option></select></div><div class="control"><label for="framework" id="framework-label"></label><select id="framework"><option value="html">HTML</option><option value="react">React</option><option value="vue">Vue</option><option value="svelte">Svelte</option></select></div><div class="control"><label for="initialization" id="initialization-label"></label><select id="initialization"><option value="csr">CSR</option><option value="ssr">SSR</option></select></div></section>
    <section id="stage" aria-live="polite"></section>
    <section id="form-stage" class="form-stage" hidden><div class="stage-heading"><p class="eyebrow">FORM</p><h2 id="form-title"></h2><p id="form-help"></p></div><div class="form-frame"><iframe id="form-frame" title="CRUDUI form"></iframe></div><a class="back-link" data-view="list" href="/">← <span id="back-list"></span></a></section>
    <details class="source"><summary id="source-label">Source identity</summary><pre id="source"></pre></details>
  </main>
  <script type="module" src="/main.mjs"></script>
</body></html>
