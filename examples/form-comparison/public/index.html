<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="data:,"><title>CRUDUI · Pipeline example</title><link rel="stylesheet" href="/crudui.css"><link rel="stylesheet" href="/comparison.css"></head>
<body class="pipeline">
  <header class="site-header"><a class="brand" href="/">CRUDUI</a><span>pipeline example</span><a href="/benchmark/">benchmark</a><a id="language" href="/?lang=en">English</a></header>
  <main class="pipeline-shell">
    <section class="hero"><p class="eyebrow">CRUDUI EXAMPLE</p><h1 id="title"></h1><p id="intro"></p><p id="pagination-contract" class="contract-note"></p></section>
    <nav class="pipeline-nav" aria-label="CRUDUI pipeline"><a data-link="list" href="/">List</a><a data-link="detail">Detail</a><a data-link="form">Form</a></nav>
    <section class="controls" aria-label="Runtime selection"><div class="control"><label for="server" id="server-label"></label><select id="server"><option value="js">JavaScript</option><option value="php">PHP</option><option value="php-ext">PHP extension</option><option value="go">Go</option><option value="rust">Rust</option></select></div><div class="control"><label for="framework" id="framework-label"></label><select id="framework"><option value="html">HTML</option><option value="react">React</option><option value="vue">Vue</option><option value="svelte">Svelte</option></select></div><div class="control"><label for="initialization" id="initialization-label"></label><select id="initialization"><option value="csr">CSR</option><option value="ssr">SSR</option></select></div><div class="control"><label for="mode" id="mode-label"></label><select id="mode"><option value="bindForm">bindForm</option><option value="createForm">createForm</option></select></div></section>
    <div class="stage-heading"><p class="eyebrow" id="view-step"></p><h2 id="view-title"></h2></div>
    <section id="stage" data-view="list" aria-live="polite"></section>
    <a class="back-link" id="back-list" data-link="list" href="/">← </a>
