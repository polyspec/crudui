[package]
name = "crudui-form-comparison"
version = "0.0.1"
edition = "2021"
rust-version = "1.89"
publish = false

[dependencies]
crudui-generator = { path = "../../../../packages/generator-rust" }
crudui-validator = { path = "../../../../packages/validator-rust" }
ordered-json = { path = "../../../../.form-comparison/sources/ordered-json/rust", version = "0.1.0" }
serde_json = { version = "1", features = ["preserve_order"] }
axum = { version = "0.8.9", features = ["multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
form_urlencoded = "1.2"
tempfile = "3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
