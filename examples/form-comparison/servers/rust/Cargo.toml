[package]
name = "polyspec-crudui-form-comparison"
version = "0.0.9"
edition = "2021"
rust-version = "1.99.0"
publish = false

[dependencies]
polyspec-crudui-generator = { path = "../../../../packages/generator/rust" }
polyspec-crudui-validator = { path = "../../../../packages/validator/rust" }
ordered-json = { package = "polyspec-ordered-json", git = "https://github.com/polyspec/ordered-json", tag = "v0.0.10", version = "0.0.10" }
serde_json = { version = "1", features = ["preserve_order"] }
axum = { version = "0.8.9", features = ["multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
form_urlencoded = "1.2"
tempfile = "3"
ryu-js = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true

[workspace]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"
