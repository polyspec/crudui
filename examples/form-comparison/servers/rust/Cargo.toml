[package]
name = "polyspec-form-comparison"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[dependencies]
polyspec-validator = { path = "../../../../packages/validator-rust" }
sortjson = { path = "/workspace/ordered-json/rust" }
serde_json = { version = "1", features = ["preserve_order"] }
axum = { version = "0.8.9", features = ["multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
form_urlencoded = "1.2"
tempfile = "3"
