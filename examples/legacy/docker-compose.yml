services:
  # Node.js API - Express validation server
  node-api:
    build:
      context: ../..
      dockerfile: examples/legacy/node-api/Dockerfile
    ports:
      - "8011:3000"
    volumes:
      - ./shared-specs:/app/examples/legacy/node-api/specs:ro
      - ./node-api/server.js:/app/examples/legacy/node-api/server.js:ro
      - ../../packages/validator-ts/dist:/app/packages/validator-ts/dist:ro
    networks:
      - form-generator-network
    labels:
      - "com.form-generator.service=node-api"
      - "com.form-generator.description=Node.js/Express validation API"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # PHP API - PHP validation server
  php-api:
    build:
      context: ../..
      dockerfile: examples/legacy/php-api/Dockerfile
    ports:
      - "8012:80"
    volumes:
      - ./shared-specs:/var/www/examples/legacy/php-api/specs:ro
      - ./php-api/validate.php:/var/www/examples/legacy/php-api/validate.php:ro
      - ./php-api/index.php:/var/www/examples/legacy/php-api/index.php:ro
      - ../../packages/validator-php/src:/var/www/packages/validator-php/src:ro
    networks:
      - form-generator-network
    labels:
      - "com.form-generator.service=php-api"
      - "com.form-generator.description=PHP validation API"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Go API - Go validation server
  go-api:
    build:
      context: ../..
      dockerfile: examples/legacy/go-api/Dockerfile
    ports:
      - "8013:8080"
    volumes:
      - ./shared-specs:/app/specs:ro
    networks:
      - form-generator-network
    labels:
      - "com.form-generator.service=go-api"
      - "com.form-generator.description=Go validation API"
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q --spider http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Rust API - Rust validation server
  rust-api:
    build:
      context: ../..
      dockerfile: examples/legacy/rust-api/Dockerfile
    ports:
      - "8017:8080"
    volumes:
      - ./shared-specs:/app/specs:ro
    networks:
      - form-generator-network
    labels:
      - "com.form-generator.service=rust-api"
      - "com.form-generator.description=Rust validation API"
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q --spider http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

networks:
  form-generator-network:
    driver: bridge
    labels:
      - "com.form-generator.network=main"
