# The folder layout of crudui (S5, S7, S9), checked by make layout-check: the common rules of config/layout.kit.yml, the
# copy of kit, and the map of this repository.
version: 1
extends:
  - layout.kit.yml

rules:
  - extends_template: no-repository-prefix
    id: layout-no-repository-prefix
    vars: { repo: crudui }

  - extends_template: go-module-path
    id: layout-go-module-path
    vars: { repo: crudui }

  # S5: the root files of kit, and three of crudui: .npmrc sets strict-allow-scripts for the npm of the root (C14.3), and
  # composer.json with composer.lock install the development vendor/ of the PHP tools and of the PHP packages, which load
  # each other through its path repositories.
  - id: layout-root-files
    paths:
      - "*"
      - "!README.md"
      - "!README.ko.md"
      - "!AGENTS.md"
      - "!AGENTS.ko.md"
      - "!PRINCIPLES.md"
      - "!PRINCIPLES.ko.md"
      - "!CHANGELOG.md"
      - "!CHANGELOG.ko.md"
      - "!LICENSE"
      - "!Makefile"
      - "!kit.json"
      - "!package.json"
      - "!package-lock.json"
      - "!tsconfig.json"
      - "!.gitignore"
      - "!.gitattributes"
      - "!.node-version"
      - "!.python-version"
      - "!.php-version"
      - "!rust-toolchain.toml"
      - "!mise.toml"
      - "!mise.lock"
      - "!ruff.toml"
      - "!phpcs.xml.dist"
      - "!phpstan.dist.neon"
      - "!Cargo.toml"
      - "!Cargo.lock"
      - "!go.work"
      - "!go.work.sum"
      - "!.golangci.yml"
      - "!.oxlintrc.json"
      - "!knip.json"
      - "!.editorconfig"
      - "!.npmrc"
      - "!composer.json"
      - "!composer.lock"

  # S7: the cross-language runners and tool tests of the root tests/: build (the tool tests of the repository),
  # conformance (the suite runs and evidence of every language), docs (the document checks), fixtures (the cases that
  # every engine reads), form-inspector (the snapshots that compare the renderers of every framework), form-markup (the
  # markup rules on the rendered fixtures of every renderer), native-generators (the runner of the generators of every
  # language), ordered-json (the keyed JSON contract against the OrderedJSON packages) and release-install (the install
  # of the released packages of every ecosystem).
  - id: layout-root-tests
    paths:
      - "tests/*"
      - "!tests/kit"
      - "!tests/build"
      - "!tests/conformance"
      - "!tests/docs"
      - "!tests/fixtures"
      - "!tests/form-inspector"
      - "!tests/form-markup"
      - "!tests/native-generators"
      - "!tests/ordered-json"
      - "!tests/release-install"
