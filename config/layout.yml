# The folder layout of crudui (S5, S7, S9), checked by make layout-check: the common rules of config/layout.kit.yml, the
# copy of kit, and the map of this repository.
version: 1
extends:
  - layout.kit.yml

rules:
  - extends_template: no-repository-prefix
    id: layout-no-repository-prefix
    vars: { repo: crudui }

  - extends_template: go-module-path
    id: layout-go-module-path
    vars: { repo: crudui }

  # S5: the root files of crudui beyond the list of kit (K145): .npmrc sets strict-allow-scripts for the npm of the root
  # (C14.3), and pyproject.toml with uv.lock is the uv workspace of the Python packages, which make crudui-install-python syncs
  # into var/python (C14.29). kit allows the development composer.json and composer.lock of the root (K167).
  # composer.local.json and its native lock declare development source dependencies separately from archive installation.
  - id: layout-root-files
    vars: { root_files: "{.npmrc,pyproject.toml,uv.lock,composer.local.json,composer.local.lock}" }

  # S7: the cross-language runners and tool tests of the root tests/: build (the tool tests of the repository),
  # conformance (the suite runs and evidence of every language), docs (the document checks), fixtures (the cases that
  # every engine reads), form-inspector (the snapshots that compare the renderers of every framework), form-markup (the
  # markup rules on the rendered fixtures of every renderer), native-generators (the runner of the generators of every
  # language), php (the child PHP processes that the PHPUnit tests of the form comparison and of the PHP extension start)
  # and release-install (the install of the released packages of every ecosystem).
  - id: layout-root-tests
    paths:
      - "tests/*"
      - "!tests/kit"
      - "!tests/build"
      - "!tests/conformance"
      - "!tests/docs"
      - "!tests/fixtures"
      - "!tests/form-inspector"
      - "!tests/form-markup"
      - "!tests/native-generators"
      - "!tests/php"
      - "!tests/release-install"

  # S5: the components of crudui beside the runtime folder php-ext: the validator and the generator, each a component with
  # a port per runtime, the renderers of the frameworks (html, react, vue, svelte), the browser validation (form-binding)
  # and the command line (cli).
  - id: layout-packages
    paths:
      - "packages/*"
      - "!packages/go"
      - "!packages/php"
      - "!packages/php-ext"
      - "!packages/python"
      - "!packages/rust"
      - "!packages/ts"
      - "!packages/js"
      - "!packages/validator"
      - "!packages/generator"
      - "!packages/html"
      - "!packages/react"
      - "!packages/vue"
      - "!packages/svelte"
      - "!packages/form-binding"
      - "!packages/cli"

  - extends_template: component-ports
    id: layout-validator-ports
    vars: { component: validator }

  - extends_template: component-ports
    id: layout-generator-ports
    vars: { component: generator }

  # S5: local-providers.json is the authoritative declaration of the external OrderedJSON source checkout.
  # Runtime source resolution reads that declaration; native package managers own links to the declared provider.
  - id: layout-config-paths
    paths: ["config/*.json", "!config/local-providers.json"]

  # S5: the root development Composer project declares the external OrderedJSON provider as a native path repository.
  # Other Composer projects and all other root path repositories retain the repository-local resolution check.
  - id: layout-composer-path
    select: ["**/composer.json", "!tests/kit/fixture/**", "!composer.json"]

  - id: layout-root-composer-path
    kind: for_each_file
    level: error
    select: ["composer.json"]
    require:
      - kind: cross_file
        relation: resolves
        source:
          file: "{path}"
          extract:
            json: "$.repositories[?@.type == 'path' && @.url != '../ordered-json/packages/php'].url"
    message: "S5: root path repositories other than the declared OrderedJSON provider resolve inside the repository"

  # S9: the infrastructure of scripts/ and tests/ is TypeScript. The exceptions each drive or serve one language:
  # - scripts/php-doc-coverage.php and tests/docs/php/DocCoverage.php: the documentation check of the classes of the PHP
  #   packages, which PHP itself runs (DocCoverageTest of each package);
  # - tests/php/PhpProcess.php: the child PHP process of the PHPUnit tests of the form comparison and the PHP extension;
  # - tests/php/FixtureJson.php: reads fixtures in PHP while preserving PHP number values, empty arrays and object values;
  # - tests/php/bootstrap.php: selects the Composer autoloader for the PHP source or native application test process;
  # - tests/conformance/php/Evidence.php and the package of tests/conformance/python: the conformance evidence that the PHP
  #   and Python suites record in their own language;
  # - scripts/generator-contract.php and scripts/go: the shared steps of the table generators that run in their own
  #   language (`php` and `go generate`), which several packages of that language use;
  # - tests/native-generators/python.py and programs/{go,php,rust}: the programs of the native generator runner, one per
  #   language, which drive the generator of that language;
  #   the test of the Go program (tests/native-generators/programs/go/main_test.go), which drives the Go generator
  #   as main.go does;
  - id: layout-infrastructure-typescript
    paths:
      - "scripts/**/*.{js,mjs,cjs,py,sh,bash,zsh,rb,pl,php,go,rs,ps1,bat,cmd}"
      - "tests/**/*.{js,mjs,cjs,py,sh,bash,zsh,rb,pl,php,go,rs,ps1,bat,cmd}"
      - "!tests/kit/fixture/**"
      - "!tests/docs/php/DocCoverage.php"
      - "!tests/php/PhpProcess.php"
      - "!tests/php/FixtureJson.php"
      - "!tests/php/bootstrap.php"
      - "!scripts/php-doc-coverage.php"
      - "!scripts/generator-contract.php"
      - "!scripts/go/**"
      - "!tests/conformance/php/Evidence.php"
      - "!tests/conformance/python/**"
      - "!tests/native-generators/python.py"
      - "!tests/native-generators/programs/go/main.go"
      - "!tests/native-generators/programs/go/main_test.go"
      - "!tests/native-generators/programs/php/generate.php"
      - "!tests/native-generators/programs/rust/src/main.rs"

  - id: layout-infrastructure-shebang
    paths:
      - "scripts/**"
      - "tests/**"
      - "!tests/kit/fixture/**"
      - "!tests/native-generators/python.py"

  # K244: these Go packages record fixture evidence and contain no test suite. The public test support package is
  # imported by the validator and generator Go modules; the internal package exposes the writer to validator tests.
  - id: suites-at-root
    paths:
      - "packages/**/integration"
      - "packages/**/conformance"
      - "!packages/validator/go/validator/internal/conformance"
      - "!packages/validator/go/testsupport/conformance"
